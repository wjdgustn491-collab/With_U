<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공식 인증서 검증 (KEITI / KCCI)</title>
<style>
  :root{
    --navy:#0f2a44;
    --navy-soft:#1c4266;
    --green:#127a4b;
    --green-bright:#1fb865;
    --line:#e2e8ef;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#12202e;
    --muted:#6b7c8f;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:40px 20px; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
  }

  .vm{
    width:100%; max-width:560px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden;
    box-shadow:0 1px 2px rgba(15,42,68,.04), 0 12px 32px -12px rgba(15,42,68,.16);
  }
  .vm::before{
    content:""; display:block; height:3px;
    background:linear-gradient(90deg,var(--navy) 0%,var(--green) 55%,var(--green-bright) 100%);
  }

  /* 헤더 */
  .vm-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    padding:22px 24px 18px; border-bottom:1px solid var(--line);
  }
  .vm-title{
    margin:0; font-size:17px; font-weight:700; letter-spacing:-.02em;
    display:flex; align-items:center; gap:8px;
  }
  .vm-badge{
    font-size:10px; font-weight:700; letter-spacing:.08em;
    color:#8a6d1f; background:#fdf5e0; border:1px solid #f0dfae;
    padding:2px 6px; border-radius:4px;
  }
  .vm-sub{margin:5px 0 0; font-size:12.5px; color:var(--muted); letter-spacing:-.01em}

  .vm-status{
    display:flex; align-items:center; gap:7px; flex-shrink:0;
    font-size:11.5px; color:var(--muted); background:#f7faf8;
    border:1px solid #dcebe2; border-radius:99px; padding:5px 11px 5px 9px;
    white-space:nowrap;
  }
  .vm-status strong{color:var(--green); font-weight:600}
  .vm-dot{
    width:7px; height:7px; border-radius:50%; background:var(--green-bright);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(31,184,101,.45)}
    50%    {opacity:.55; box-shadow:0 0 0 5px rgba(31,184,101,0)}
  }

  /* 입력부 */
  .vm-body{padding:24px}
  .vm-label{display:block; font-size:12.5px; font-weight:600; color:var(--navy-soft); margin-bottom:8px}
  .vm-field{display:flex; gap:8px}
  .vm-input{
    flex:1; min-width:0; padding:12px 14px; font-size:14px; font-family:inherit;
    border:1px solid var(--line); border-radius:9px; background:#fbfcfd; color:var(--text);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .vm-input::placeholder{color:#a9b6c4; font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-size:13px}
  .vm-input:focus{outline:none; background:#fff; border-color:var(--navy-soft); box-shadow:0 0 0 3px rgba(28,66,102,.1)}
  .vm-input:disabled{background:#f2f4f7; color:var(--muted)}

  .vm-btn{
    padding:12px 18px; font-size:13.5px; font-weight:600; font-family:inherit; white-space:nowrap;
    color:#fff; background:var(--navy); border:none; border-radius:9px; cursor:pointer;
    transition:background .15s, transform .08s;
  }
  .vm-btn:hover:not(:disabled){background:var(--navy-soft)}
  .vm-btn:active:not(:disabled){transform:translateY(1px)}
  .vm-btn:disabled{background:#95a5b6; cursor:not-allowed}

  .vm-hint{margin:9px 2px 0; font-size:12px; color:#c0392b; min-height:16px}

  /* 로딩 */
  .vm-loading{
    display:flex; align-items:center; gap:11px; margin-top:20px; padding:18px 16px;
    background:#f8fafc; border:1px solid var(--line); border-radius:11px;
    font-size:13.5px; color:var(--navy-soft);
    animation:fade .2s ease-out;
  }
  .vm-spinner{
    width:17px; height:17px; flex-shrink:0; border-radius:50%;
    border:2px solid #d6e0ea; border-top-color:var(--navy);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0} to{opacity:1}}

  /* 결과 카드 */
  .vm-result{
    margin-top:20px; border:1px solid #cfe6da; border-radius:12px; overflow:hidden;
    background:linear-gradient(180deg,#f6fbf8 0%,#fff 42%);
    animation:rise .35s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  .vm-result-head{
    display:flex; align-items:center; gap:12px; padding:18px 20px 16px;
    border-bottom:1px solid #e4f0ea;
  }
  .vm-seal{
    width:38px; height:38px; flex-shrink:0; border-radius:50%;
    background:var(--green); display:grid; place-items:center;
    box-shadow:0 0 0 4px rgba(18,122,75,.12);
  }
  .vm-seal svg{width:19px; height:19px}
  .vm-verdict{margin:0; font-size:15.5px; font-weight:700; color:var(--green); letter-spacing:-.02em}
  .vm-verdict span{font-weight:500; color:var(--muted); font-size:12.5px; margin-left:5px}
  .vm-serial{
    margin:3px 0 0; font-size:12px; color:var(--muted);
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; letter-spacing:.02em;
  }

  .vm-rows{margin:0; padding:6px 20px 16px}
  .vm-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:16px;
    padding:11px 0; border-bottom:1px dashed #e6ecf1;
  }
  .vm-row:last-child{border-bottom:none}
  .vm-row dt{font-size:12.5px; color:var(--muted); flex-shrink:0}
  .vm-row dd{margin:0; font-size:13.5px; font-weight:600; color:var(--text); text-align:right}
  .vm-row dd.ok{color:var(--green)}
  .vm-row dd.bad{color:#dc2626; font-weight:600}
  /* 미연결·오류 상태에서는 표시등과 배지를 초록에서 내린다 (거짓 Live 방지) */
  .vm-status[data-state="off"] strong{color:#b45309}
  .vm-status[data-state="off"] .vm-dot{background:#b45309; animation:none}
  .vm-result[data-verdict="bad"] .vm-seal{background:#dc2626}
  .vm-note a{color:inherit}
  .vm-row dd.amount{font-size:16px; color:var(--navy); letter-spacing:-.02em}
  .vm-row dd.amount em{font-style:normal; font-size:12px; color:var(--muted); font-weight:500; margin-left:3px}
  .vm-row dd.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-weight:500; font-size:13px}

  .vm-foot{
    padding:11px 20px; background:#f7faf8; border-top:1px solid #e4f0ea;
    font-size:11px; color:var(--muted); display:flex; justify-content:space-between; gap:12px;
  }
  .vm-note{
    margin:0; padding:12px 24px; background:#fbfcfd; border-top:1px solid var(--line);
    font-size:11px; color:#98a6b5; line-height:1.5;
  }

  @media (max-width:420px){
    .vm-head{flex-direction:column-reverse; align-items:flex-start}
    .vm-field{flex-direction:column}
    .vm-btn{width:100%}
  }
</style>
</head>
<body>

<section class="vm">
  <header class="vm-head">
    <div>
      <h2 class="vm-title">공식 인증서 검증 <span class="vm-badge" id="vmBadge">확인 중</span></h2>
      <p class="vm-sub">한국환경산업기술원(KEITI) 환경표지인증 공식 데이터</p>
    </div>
    <div class="vm-status" role="status" id="vmStatus">
      <span class="vm-dot" aria-hidden="true"></span>
      <span>API 상태: <strong id="vmStatusText">확인 중...</strong></span>
    </div>
  </header>

  <div class="vm-body">
    <form id="vmForm" novalidate>
      <label class="vm-label" for="vmSerial">인증번호 또는 인증제품명</label>
      <div class="vm-field">
        <input class="vm-input" id="vmSerial" type="text" placeholder="예: EL245 / 재활용 화장지"
               autocomplete="off" spellcheck="false" aria-describedby="vmHint">
        <button class="vm-btn" id="vmBtn" type="submit">API로 검증하기</button>
      </div>
      <p class="vm-hint" id="vmHint" role="alert"></p>
    </form>

    <div id="vmOut" aria-live="polite" aria-busy="false"></div>
  </div>

  <p class="vm-note">
    ※ 조회 대상: 한국환경산업기술원 <strong>환경표지인증 해지·취소 제품</strong> 공식 오픈API
    (<a href="https://www.data.go.kr/data/15158373/openapi.do" target="_blank" rel="noopener">공공데이터포털</a>).
    해지·취소 이력이 없음을 확인하는 방식이며, 인증의 최초 발급 사실 자체를 증명하지는 않습니다.
  </p>
</section>

<script>
(function () {
  'use strict';

  var form  = document.getElementById('vmForm');
  var input = document.getElementById('vmSerial');
  var btn   = document.getElementById('vmBtn');
  var hint  = document.getElementById('vmHint');
  var out   = document.getElementById('vmOut');

  var badge      = document.getElementById('vmBadge');
  var statusEl   = document.getElementById('vmStatus');
  var statusText = document.getElementById('vmStatusText');

  /* 서버리스 프록시(api/verify.js)를 경유한다.
     브라우저에서 data.go.kr 을 직접 부르면 CORS 로 막히고,
     인증키를 프론트에 두면 소스보기로 노출되기 때문. */
  var ENDPOINT = '/api/verify';

  /** 상태 표시등을 실제 연결 상태로 갱신한다. 장식이 아니라 헬스체크 결과. */
  function refreshStatus() {
    return fetch(ENDPOINT)
      .then(function (res) { return res.json(); })
      .then(function (d) {
        if (d.configured) {
          setStatus('live', '연결됨 (Live)', 'LIVE');
        } else {
          setStatus('off', '인증키 미설정', 'SETUP');
        }
        return d.configured;
      })
      .catch(function () {
        // 로컬에서 HTML만 열면 프록시가 없으므로 여기로 온다
        setStatus('off', '프록시 없음', 'OFFLINE');
        return false;
      });
  }

  function setStatus(kind, text, badgeText) {
    statusText.textContent = text;
    badge.textContent = badgeText;
    statusEl.setAttribute('data-state', kind);
    statusEl.setAttribute('aria-label', 'API 상태 ' + text);
  }

  function fetchCertificate(serial) {
    return fetch(ENDPOINT + '?serial=' + encodeURIComponent(serial))
      .then(function (res) {
        return res.json().then(function (body) {
          if (!res.ok) {
            throw new Error(body.error || ('HTTP ' + res.status));
          }
          return body;
        });
      });
  }

  function renderLoading() {
    out.setAttribute('aria-busy', 'true');
    out.innerHTML =
      '<div class="vm-loading">' +
        '<span class="vm-spinner" aria-hidden="true"></span>' +
        '<span>KEITI DB에서 불러오는 중...</span>' +
      '</div>';
  }

  var ICON_OK =
    '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';
  var ICON_BAD =
    '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function row(label, value, cls) {
    return '<div class="vm-row"><dt>' + label + '</dt>' +
           '<dd' + (cls ? ' class="' + cls + '"' : '') + '>' +
           escapeHtml(value || '—') + '</dd></div>';
  }

  function renderResult(d) {
    out.setAttribute('aria-busy', 'false');

    // 이 데이터셋은 해지·취소된 건만 담고 있다.
    // 조회 결과 있음 = 해지/취소 이력 있음 = 무효.
    var revoked = d.revoked;
    var hit = (d.matches && d.matches[0]) || {};

    var rows = revoked
      ? row('상태', '무효 — 인증 해지·취소됨', 'bad') +
        row('인증번호', hit.certNo) +
        row('인증제품명', hit.productName) +
        row('인증기업', hit.company) +
        row('해지·취소일', hit.revokedAt, 'mono') +
        row('사유', hit.reason)
      : row('상태', '해지·취소 이력 없음', 'ok') +
        row('조회값', d.query) +
        row('대조 건수', String(d.totalCount) + '건 일치') +
        row('데이터 출처', d.source);

    out.innerHTML =
      '<article class="vm-result" data-verdict="' + (revoked ? 'bad' : 'ok') + '">' +
        '<div class="vm-result-head">' +
          '<div class="vm-seal" aria-hidden="true">' + (revoked ? ICON_BAD : ICON_OK) + '</div>' +
          '<div>' +
            '<p class="vm-verdict">' +
              (revoked ? '인증 무효 <span>Revoked</span>' : '해지·취소 이력 없음 <span>Not Revoked</span>') +
            '</p>' +
            '<p class="vm-serial">' + escapeHtml(d.query) + '</p>' +
          '</div>' +
        '</div>' +
        '<dl class="vm-rows">' + rows + '</dl>' +
        '<div class="vm-foot">' +
          '<span>조회 시각 ' + timestamp() + '</span>' +
          '<span>' + escapeHtml(d.dataset || 'KEITI 공식 오픈API') +
            (d.cached ? ' (캐시)' : '') + '</span>' +
        '</div>' +
      '</article>';
  }

  function timestamp() {
    var n = new Date();
    var p = function (v) { return String(v).padStart(2, '0'); };
    return n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()) +
           ' ' + p(n.getHours()) + ':' + p(n.getMinutes());
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function setBusy(busy) {
    btn.disabled = busy;
    input.disabled = busy;
    btn.textContent = busy ? '검증 중...' : 'API로 검증하기';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var serial = input.value.trim().toUpperCase();
    if (!serial) {
      hint.textContent = '인증서 일련번호를 입력해 주세요.';
      input.focus();
      return;
    }

    hint.textContent = '';
    setBusy(true);
    renderLoading();

    fetchCertificate(serial)
      .then(renderResult)
      .catch(function (err) {
        out.setAttribute('aria-busy', 'false');
        out.innerHTML = '';
        hint.textContent = '조회에 실패했습니다: ' + err.message;
      })
      .then(function () { setBusy(false); });
  });

  input.addEventListener('input', function () {
    if (hint.textContent) hint.textContent = '';
  });

  // 표시등이 실제 연결 상태를 반영하도록 로드 시 한 번 확인
  refreshStatus();
})();
</script>

</body>
</html>
