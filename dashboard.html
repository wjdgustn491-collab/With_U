<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoPulse - 통합 환경 영향 대시보드</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Noto Sans KR', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Custom Styles for Glassmorphism & Animations -->
  <style>
    /* Glassmorphism scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.4);
    }
    
    /* Subtle pulse animation for glowing states */
    @keyframes subtle-glow {
      0%, 100% {
        box-shadow: 0 0 15px 0px rgba(16, 185, 129, 0.1);
      }
      50% {
        box-shadow: 0 0 25px 2px rgba(16, 185, 129, 0.25);
      }
    }
    .glow-active {
      animation: subtle-glow 3s infinite ease-in-out;
    }
  </style>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (for JSX compilation in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts Dependencies -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden selection:bg-emerald-500/30 selection:text-emerald-200">
  
  <!-- Background Decorative Glowing Blobs -->
  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-emerald-950/20 rounded-full blur-[120px] pointer-events-none -z-10"></div>
  <div class="absolute bottom-10 left-0 w-[600px] h-[600px] bg-sky-950/25 rounded-full blur-[150px] pointer-events-none -z-10"></div>
  <div class="absolute top-1/3 left-1/3 w-[300px] h-[300px] bg-emerald-900/10 rounded-full blur-[100px] pointer-events-none -z-10"></div>

  <div id="root"></div>

  <!-- React Code with Babel JSX compilation -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { 
      ResponsiveContainer, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, 
      BarChart, Bar, Cell, PieChart, Pie, Legend, RadialBarChart, RadialBar 
    } = Recharts;

    // Direct SVG React components for Lucide icons to eliminate loading lag or CDN errors
    const WindIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M12.8 19.6A2 2 0 1 0 14 16H2" />
        <path d="M17.5 12.6A2 2 0 1 0 18 9H2" />
        <path d="M9.8 5.8A2 2 0 1 0 11 9H2" />
      </svg>
    );

    const DropletIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M12 22a7 7 0 0 0 7-7c0-4.3-7-11-7-11S5 10.7 5 15a7 7 0 0 0 7 7z" />
      </svg>
    );

    const GlobeIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
        <path d="M2 12h20" />
      </svg>
    );

    const ActivityIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
      </svg>
    );

    const ZapIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
    );

    const FlameIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
      </svg>
    );

    const LeafIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 9.8A7 7 0 0 1 11 20z" />
        <path d="M19 2c-2.26 4.33-5.27 7.14-8 10" />
      </svg>
    );

    const RefreshCwIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M16 3h5v5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 21H3v-5" />
      </svg>
    );

    const DatabaseIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <ellipse cx="12" cy="5" rx="9" ry="3" />
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
        <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3" />
      </svg>
    );

    const SparklesIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        <path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5.5z" />
        <path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" />
      </svg>
    );

    const ChevronRightIcon = (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="m9 18 6-6-6-6" />
      </svg>
    );

    // Mock Database for tree species carbon absorption capacity (Korean)
    const treeSpeciesData = [
      { name: "참나무", co2: 22, color: "#10b981", water: "높음", desc: "가장 높은 탄소 흡수량을 자랑하며, 풍부한 산림 생물 다양성을 보호합니다." },
      { name: "편백나무", co2: 18, color: "#059669", water: "낮음", desc: "가뭄 저항성이 매우 강한 상록수로, 우수한 탄소 고정 능력을 지니고 있습니다." },
      { name: "단풍나무", co2: 15, color: "#34d399", water: "보통", desc: "계절에 따른 우수한 조경 기능과 함께 안정적인 탄소 흡수 성능을 제공합니다." },
      { name: "소나무", co2: 12, color: "#6ee7b7", water: "보통", desc: "산성 토양에서도 빠르게 자라는 침엽수로, 연중 안정적으로 대기 질을 개선합니다." }
    ];

    // Mock monthly emissions/offset balance data (Korean)
    const monthlyBalanceData = [
      { name: "1월", Emissions: 450, Offsets: 280 },
      { name: "2월", Emissions: 430, Offsets: 290 },
      { name: "3월", Emissions: 380, Offsets: 310 },
      { name: "4월", Emissions: 350, Offsets: 330 },
      { name: "5월", Emissions: 310, Offsets: 340 },
      { name: "6월", Emissions: 290, Offsets: 360 }
    ];

    // Colors for Donut Chart
    const EMISSION_COLORS = ["#10b981", "#0ea5e9", "#f43f5e", "#e2e8f0"];

    function App() {
      // Calculator state
      const [isAutoSync, setIsAutoSync] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [electricity, setElectricity] = useState("320");
      const [gas, setGas] = useState("65");
      const [calculatedFootprint, setCalculatedFootprint] = useState(null);

      // Interactive selected tree details
      const [selectedTree, setSelectedTree] = useState(treeSpeciesData[0]);

      // Interactive Net-Zero Goal Milestones
      const [milestones, setMilestones] = useState([
        { id: 1, label: "5kW 주택용 태양광 발전기 설치", points: 8, checked: true },
        { id: 2, label: "전기자동차(EV)로 전환 완료", points: 12, checked: true },
        { id: 3, label: "친환경 주택 단열재 전면 보강", points: 5, checked: false },
        { id: 4, label: "음식물 및 유기 폐기물 퇴비화", points: 4, checked: true },
        { id: 5, label: "자생종 나무 15그루 식재", points: 6, checked: false },
      ]);

      // Calculate Net-Zero completion dynamically based on checklist and calculator results
      const netZeroBasePercent = 45; // Base efficiency
      const netZeroProgress = useMemo(() => {
        const checkedPoints = milestones
          .filter(m => m.checked)
          .reduce((sum, item) => sum + item.points, 0);
        
        // Add variable adjustment based on calculator's emission levels (lower emissions = higher progress)
        let calculatorBonus = 10;
        if (calculatedFootprint) {
          const totalKg = parseFloat(calculatedFootprint.total);
          if (totalKg < 200) calculatorBonus = 15;
          else if (totalKg > 400) calculatorBonus = 5;
        }
        return Math.min(netZeroBasePercent + checkedPoints + calculatorBonus, 100);
      }, [milestones, calculatedFootprint]);

      // Handle Manual / Auto-Sync switch trigger
      useEffect(() => {
        if (isAutoSync) {
          setIsSyncing(true);
          const timer = setTimeout(() => {
            setIsSyncing(false);
            setElectricity("412"); // Mock synced electricity (kWh)
            setGas("85");          // Mock synced gas (m3)
          }, 1500);
          return () => clearTimeout(timer);
        }
      }, [isAutoSync]);

      // Calculate carbon footprint
      const handleCalculate = (e) => {
        if (e) e.preventDefault();
        const elecKg = (parseFloat(electricity) || 0) * 0.457;
        const gasKg = (parseFloat(gas) || 0) * 2.22;
        const total = elecKg + gasKg;

        setCalculatedFootprint({
          electricity: elecKg.toFixed(1),
          gas: gasKg.toFixed(1),
          total: total.toFixed(1)
        });
      };

      // Run initial calculation
      useEffect(() => {
        handleCalculate();
      }, [electricity, gas]);

      // Toggle milestone state
      const toggleMilestone = (id) => {
        setMilestones(prev => prev.map(m => m.id === id ? { ...m, checked: !m.checked } : m));
      };

      // PieChart emission data based dynamically on calculator values
      const emissionSourcesData = useMemo(() => {
        const elecVal = calculatedFootprint ? parseFloat(calculatedFootprint.electricity) : 146.2;
        const gasVal = calculatedFootprint ? parseFloat(calculatedFootprint.gas) : 144.3;
        return [
          { name: "전력 사용량", value: elecVal },
          { name: "가스 & 난방", value: gasVal },
          { name: "교통 및 운송", value: 120 },
          { name: "폐기물 처리", value: 45 }
        ];
      }, [calculatedFootprint]);

      const totalEmissionsSum = useMemo(() => {
        return emissionSourcesData.reduce((sum, d) => sum + d.value, 0).toFixed(0);
      }, [emissionSourcesData]);

      // Radial progress chart config
      const progressChartData = [{ name: "Progress", value: netZeroProgress, fill: "url(#radialGreen)" }];

      return (
        <div className="max-w-[1400px] mx-auto p-4 md:p-6 lg:p-8 space-y-6">
          
          {/* Header Dashboard Banner */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900/40 backdrop-blur-xl border border-slate-800/80 p-5 rounded-2xl glow-active">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-2 bg-emerald-500/10 rounded-lg text-emerald-400">
                  <LeafIcon className="w-6 h-6 animate-pulse" />
                </span>
                <h1 className="text-2xl md:text-3xl font-extrabold bg-gradient-to-r from-emerald-400 via-emerald-300 to-sky-400 bg-clip-text text-transparent">
                  EcoPulse 통합 관제
                </h1>
              </div>
              <p className="text-slate-400 text-sm md:text-base mt-1">
                통합 환경 영향 분석, 탄소 흡수 수종 분석 및 핵심 KPI 대시보드
              </p>
            </div>
            
            <div className="flex items-center gap-3">
              <span className="h-2 w-2 rounded-full bg-emerald-400 animate-ping"></span>
              <span className="text-xs font-semibold bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-500/20">
                실시간 서버 연동 완료
              </span>
              <span className="text-slate-400 text-xs hidden sm:inline">
                2026년 7월 1일
              </span>
            </div>
          </header>

          {/* Bento-style CSS Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            {/* 1. Main Overview: Input vs Output Chart (Spans 2 columns on desktop) */}
            <section className="col-span-1 md:col-span-2 bg-slate-900/40 backdrop-blur-xl border border-slate-800/80 p-6 rounded-2xl flex flex-col justify-between hover:border-emerald-500/20 transition-all duration-300 shadow-xl shadow-black/30">
              <div className="flex justify-between items-start mb-4">
                <div>
                  <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                    실시간 균형: 배출량 vs. 상쇄량
                  </h2>
                  <p className="text-xs text-slate-400">실시간 유입되는 탄소 배출량과 자생적 유기물 상쇄량 비교 분석</p>
                </div>
                <div className="flex items-center gap-4 text-xs">
                  <div className="flex items-center gap-1">
                    <span className="h-2 w-2 rounded-full bg-rose-500"></span>
                    <span className="text-slate-300">배출량 (Emissions)</span>
                  </div>
                  <div className="flex items-center gap-1">
                    <span className="h-2 w-2 rounded-full bg-emerald-500"></span>
                    <span className="text-slate-300">상쇄량 (Offsets)</span>
                  </div>
                </div>
              </div>

              {/* Overlapping Area Chart */}
              <div className="w-full h-64 md:h-72 mt-2">
                <ResponsiveContainer width="100%" height="100%">
                  <AreaChart data={monthlyBalanceData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                    <defs>
                      <linearGradient id="colorEmissions" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="5%" stopColor="#f43f5e" stopOpacity={0.4}/>
                        <stop offset="95%" stopColor="#f43f5e" stopOpacity={0.0}/>
                      </linearGradient>
                      <linearGradient id="colorOffsets" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="5%" stopColor="#10b981" stopOpacity={0.4}/>
                        <stop offset="95%" stopColor="#10b981" stopOpacity={0.0}/>
                      </linearGradient>
                    </defs>
                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" opacity={0.3} />
                    <XAxis dataKey="name" stroke="#64748b" tickLine={false} style={{ fontSize: 12 }} />
                    <YAxis stroke="#64748b" tickLine={false} style={{ fontSize: 12 }} />
                    <Tooltip 
                      contentStyle={{ backgroundColor: 'rgba(15, 23, 42, 0.9)', borderColor: '#334155', borderRadius: 8, color: '#f1f5f9' }}
                      labelStyle={{ fontWeight: 'bold', color: '#10b981' }}
                    />
                    <Area type="monotone" dataKey="Emissions" name="배출량" stroke="#f43f5e" strokeWidth={2.5} fillOpacity={1} fill="url(#colorEmissions)" />
                    <Area type="monotone" dataKey="Offsets" name="상쇄량" stroke="#10b981" strokeWidth={2.5} fillOpacity={1} fill="url(#colorOffsets)" />
                  </AreaChart>
                </ResponsiveContainer>
              </div>

              {/* Dynamic status footer inside chart */}
              <div className="mt-4 pt-4 border-t border-slate-800/80 flex justify-between items-center text-xs">
                <p className="text-slate-400">배출 균형 추이: 최근 6개월 동안 <span className="text-emerald-400 font-semibold">순 CO2eq 14.2% 감축</span> 달성 중</p>
                <a href="#" className="text-emerald-400 font-semibold hover:underline flex items-center gap-0.5">
                  상세 분석 리포트 <ChevronRightIcon className="w-3.5 h-3.5" />
                </a>
              </div>
            </section>

            {/* 2. Multi-Footprint Metrics (4 Mini KPI cards inside a 2x2 Grid) */}
            <section className="col-span-1 bg-slate-900/40 backdrop-blur-xl border border-slate-800/80 p-6 rounded-2xl flex flex-col justify-between hover:border-emerald-500/20 transition-all duration-300 shadow-xl shadow-black/30">
              <div className="mb-4">
                <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                  다차원 발자국 지표 (KPI)
                </h2>
                <p className="text-xs text-slate-400 font-medium">환경 전반에 미치는 핵심 발자국 데이터 및 추세</p>
              </div>

              <div className="grid grid-cols-2 gap-4 h-full">
                
                {/* Carbon Card */}
                <div className="bg-slate-950/45 p-4 rounded-xl border border-slate-800/50 hover:border-emerald-500/25 transition-all duration-300 flex flex-col justify-between">
                  <div className="flex justify-between items-start">
                    <span className="p-1.5 bg-emerald-500/10 text-emerald-400 rounded-lg">
                      <WindIcon className="w-4 h-4" />
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-500/10 text-emerald-400">
                      -8.4%
                    </span>
                  </div>
                  <div className="mt-3">
                    <p className="text-slate-400 text-xs font-semibold">탄소 발자국 (CO2eq)</p>
                    <p className="text-lg font-bold text-white mt-0.5">12.4 톤</p>
                  </div>
                </div>

                {/* Water Card */}
                <div className="bg-slate-950/45 p-4 rounded-xl border border-slate-800/50 hover:border-sky-500/25 transition-all duration-300 flex flex-col justify-between">
                  <div className="flex justify-between items-start">
                    <span className="p-1.5 bg-sky-500/10 text-sky-400 rounded-lg">
                      <DropletIcon className="w-4 h-4" />
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-rose-500/10 text-rose-400">
                      +2.1%
                    </span>
                  </div>
                  <div className="mt-3">
                    <p className="text-slate-400 text-xs font-semibold">물 발자국 (Liters)</p>
                    <p className="text-lg font-bold text-white mt-0.5">245k L</p>
                  </div>
                </div>

                {/* Ecological Card */}
                <div className="bg-slate-950/45 p-4 rounded-xl border border-slate-800/50 hover:border-emerald-500/25 transition-all duration-300 flex flex-col justify-between">
                  <div className="flex justify-between items-start">
                    <span className="p-1.5 bg-emerald-500/10 text-emerald-400 rounded-lg">
                      <GlobeIcon className="w-4 h-4" />
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-500/10 text-emerald-400">
                      -4.2%
                    </span>
                  </div>
                  <div className="mt-3">
                    <p className="text-slate-400 text-xs font-semibold">생태 발자국 (gha)</p>
                    <p className="text-lg font-bold text-white mt-0.5">4.2 gha</p>
                  </div>
                </div>

                {/* Nitrogen Card */}
                <div className="bg-slate-950/45 p-4 rounded-xl border border-slate-800/50 hover:border-sky-500/25 transition-all duration-300 flex flex-col justify-between">
                  <div className="flex justify-between items-start">
                    <span className="p-1.5 bg-sky-500/10 text-sky-400 rounded-lg">
                      <ActivityIcon className="w-4 h-4" />
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-500/10 text-emerald-400">
                      +0.5%
                    </span>
                  </div>
                  <div className="mt-3">
                    <p className="text-slate-400 text-xs font-semibold">질소 발자국 (kg N)</p>
                    <p className="text-lg font-bold text-white mt-0.5">320 kg</p>
                  </div>
                </div>

              </div>
            </section>

            {/* 3. Energy Emission Calculator & KEPCO API Hub */}
            <section className="col-span-1 bg-slate-900/40 backdrop-blur-xl border border-slate-800/80 p-6 rounded-2xl flex flex-col justify-between hover:border-emerald-500/20 transition-all duration-300 shadow-xl shadow-black/30">
              <div>
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                      한전 KEPCO API & 계산기
                    </h2>
                    <p className="text-xs text-slate-400">전력 및 가스 소비량을 실시간 탄소량으로 계산</p>
                  </div>
                  <span className="p-2 bg-slate-800 text-sky-400 rounded-lg border border-slate-700/60">
                    <DatabaseIcon className="w-4 h-4" />
                  </span>
                </div>

                {/* API Toggle Switch */}
                <div className="flex items-center justify-between p-2.5 bg-slate-950/45 rounded-xl border border-slate-800/80 mb-4">
                  <span className="text-xs font-semibold text-slate-300">
                    {isAutoSync ? "한전 스마트미터 실시간 연동" : "수동 에너지 소비량 직접 입력"}
                  </span>
                  
                  <button 
                    onClick={() => setIsAutoSync(!isAutoSync)}
                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors duration-300 focus:outline-none ${isAutoSync ? 'bg-emerald-500' : 'bg-slate-800'}`}
                  >
                    <span 
                      className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform duration-300 ${isAutoSync ? 'translate-x-6' : 'translate-x-1'}`}
                    />
                  </button>
                </div>

                {/* Input Fields */}
                <form onSubmit={handleCalculate} className="space-y-3">
                  <div>
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">
                      전력 소비량 (Electricity)
                    </label>
                    <div className="relative">
                      <input 
                        type="number" 
                        value={electricity}
                        disabled={isAutoSync}
                        onChange={(e) => setElectricity(e.target.value)}
                        className="w-full bg-slate-950/60 border border-slate-800/80 rounded-xl px-4 py-2.5 text-sm font-semibold text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500/60 disabled:opacity-50 transition-colors"
                        placeholder="전력 사용량 입력..."
                      />
                      <span className="absolute right-3.5 top-2.5 text-xs text-slate-500 font-bold">kWh</span>
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">
                      도시가스 사용량 (Gas)
                    </label>
                    <div className="relative">
                      <input 
                        type="number" 
                        value={gas}
                        disabled={isAutoSync}
                        onChange={(e) => setGas(e.target.value)}
                        className="w-full bg-slate-950/60 border border-slate-800/80 rounded-xl px-4 py-2.5 text-sm font-semibold text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500/60 disabled:opacity-50 transition-colors"
                        placeholder="가스 사용량 입력..."
                      />
                      <span className="absolute right-3.5 top-2.5 text-xs text-slate-500 font-bold">m³</span>
                    </div>
                  </div>
                </form>
              </div>

              {/* Simulated loader during API sync */}
              {isSyncing ? (
                <div className="bg-slate-950/60 border border-slate-800/50 rounded-xl p-4 mt-4 flex items-center justify-center gap-3 h-24">
                  <RefreshCwIcon className="w-5 h-5 text-sky-400 animate-spin" />
                  <span className="text-xs font-semibold text-slate-400">KEPCO 스마트 미터 ID #8892-X 연동 중...</span>
                </div>
              ) : (
                /* Dynamic Result Display */
                calculatedFootprint && (
                  <div className="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 mt-4 hover:border-emerald-500/10 transition-colors flex items-center justify-between">
                    <div>
                      <p className="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">탄소 배출 계산 결과</p>
                      <p className="text-2xl font-extrabold text-white mt-1">
                        {calculatedFootprint.total} <span className="text-xs font-semibold text-slate-400">kg CO2eq</span>
                      </p>
                    </div>
                    <div className="text-right text-[10px] text-slate-500">
                      <p>전력: {calculatedFootprint.electricity} kg</p>
                      <p>가스: {calculatedFootprint.gas} kg</p>
                    </div>
                  </div>
                )
              )}
            </section>

            {/* 4. Tree Species Sequestration Analysis */}
            <section className="col-span-1 bg-slate-900/40 backdrop-blur-xl border border-slate-800/80 p-6 rounded-2xl flex flex-col justify-between hover:border-emerald-500/20 transition-all duration-300 shadow-xl shadow-black/30">
              <div>
                <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                  수종별 연간 탄소 흡수량
                </h2>
                <p className="text-xs text-slate-400 mb-3">수종별 나무 한 그루당 연간 이산화탄소(CO₂) 흡수량 비교</p>
              </div>

              {/* Bar Chart */}
              <div className="w-full h-44 mt-2">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={treeSpeciesData} margin={{ top: 10, right: 10, left: -25, bottom: 0 }}>
                    <defs>
                      <linearGradient id="barGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="5%" stopColor="#10b981" stopOpacity={0.9}/>
                        <stop offset="95%" stopColor="#059669" stopOpacity={0.3}/>
                      </linearGradient>
                    </defs>
                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" opacity={0.2} vertical={false} />
                    <XAxis dataKey="name" stroke="#64748b" tickLine={false} style={{ fontSize: 11 }} />
                    <YAxis stroke="#64748b" tickLine={false} style={{ fontSize: 11 }} />
                    <Tooltip 
                      cursor={{ fill: 'rgba(16, 185, 129, 0.05)', radius: 6 }}
                      content={({ active, payload }) => {
                        if (active && payload && payload.length) {
                          const data = payload[0].payload;
                          return (
                            <div className="bg-slate-950 border border-slate-800 p-2.5 rounded-lg shadow-xl text-xs">
                              <p className="font-bold text-emerald-400">{data.name}</p>
                              <p className="text-slate-100 font-semibold mt-0.5">연간 {data.co2} kg CO2 흡수</p>
                              <p className="text-slate-500 text-[10px] mt-1">물 요구도: {data.water}</p>
                            </div>
                          );
                        }
                        return null;
                      }}
                    />
                    <Bar 
                      dataKey="co2" 
                      fill="url(#barGradient)" 
                      radius={[6, 6, 0, 0]}
                      onClick={(data) => setSelectedTree(data)}
                      className="cursor-pointer"
                    >
                      {treeSpeciesData.map((entry, index) => (
                        <Cell 
                          key={`cell-${index}`} 
                          stroke={selectedTree.name === entry.name ? "#34d399" : "none"} 
                          strokeWidth={2}
                        />
                      ))}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>

              {/* Selected Tree Species detail pane */}
              <div className="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl mt-3 flex items-start gap-2.5">
                <span className="p-1.5 bg-emerald-500/10 text-emerald-400 rounded-lg mt-0.5">
                  <SparklesIcon className="w-4 h-4" />
                </span>
                <div>
                  <h4 className="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                    {selectedTree.name} 상세 수종 분석
                    <span className="text-[9px] font-medium bg-emerald-500/10 px-2 py-0.5 rounded-full text-emerald-300">
                      연간 {selectedTree.co2}kg 흡수
                    </span>
                  </h4>
                  <p className="text-[10px] text-slate-400 mt-1 leading-relaxed">{selectedTree.desc}</p>
                </div>
              </div>
            </section>

            {/* 5. Emission Sources Breakdown */}
            <section className="col-span-1 bg-slate-900/40 backdrop-blur-xl border border-slate-800/80 p-6 rounded-2xl flex flex-col justify-between hover:border-emerald-500/20 transition-all duration-300 shadow-xl shadow-black/30">
              <div>
                <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                  주요 탄소 배출원 구성
                </h2>
                <p className="text-xs text-slate-400">에너지원 및 기타 환경 가스 발생 비율</p>
              </div>

              <div className="relative flex justify-center items-center h-48 mt-2">
                <div className="absolute flex flex-col items-center justify-center">
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">전체 배출량</span>
                  <span className="text-xl font-extrabold text-white">{totalEmissionsSum} kg</span>
                </div>
                
                <ResponsiveContainer width="100%" height="100%">
                  <PieChart>
                    <Pie
                      data={emissionSourcesData}
                      cx="50%"
                      cy="50%"
                      innerRadius={58}
                      outerRadius={75}
                      paddingAngle={3}
                      dataKey="value"
                    >
                      {emissionSourcesData.map((entry, index) => (
                        <Cell key={`cell-${index}`} fill={EMISSION_COLORS[index % EMISSION_COLORS.length]} />
                      ))}
                    </Pie>
                    <Tooltip 
                      contentStyle={{ backgroundColor: '#0f172a', borderColor: '#1e293b', borderRadius: 8, color: '#f1f5f9' }}
                      itemStyle={{ color: '#10b981' }}
                    />
                  </PieChart>
                </ResponsiveContainer>
              </div>

              {/* Legends */}
              <div className="grid grid-cols-2 gap-2 text-xs border-t border-slate-800/80 pt-3">
                {emissionSourcesData.map((entry, idx) => (
                  <div key={entry.name} className="flex items-center gap-2">
                    <span className="h-2 w-2 rounded-full" style={{ backgroundColor: EMISSION_COLORS[idx] }}></span>
                    <span className="text-slate-400">{entry.name}:</span>
                    <span className="font-bold text-white ml-auto">{entry.value.toFixed(0)} kg</span>
                  </div>
                ))}
              </div>
            </section>

            {/* 6. Net-Zero Goal Tracking (Full 3 Columns Layout in Bento Grid) */}
            <section className="col-span-1 md:col-span-2 lg:col-span-3 bg-slate-900/40 backdrop-blur-xl border border-slate-800/80 p-6 rounded-2xl hover:border-emerald-500/20 transition-all duration-300 shadow-xl shadow-black/30">
              <div className="flex flex-col lg:flex-row justify-between items-stretch gap-6">
                
                {/* Goal Header and Gauge */}
                <div className="flex-1 flex flex-col sm:flex-row items-center gap-6 border-b lg:border-b-0 lg:border-r border-slate-800/80 pb-6 lg:pb-0 lg:pr-6">
                  
                  {/* Radial progress gauge */}
                  <div className="relative w-40 h-40 flex items-center justify-center shrink-0">
                    <div className="absolute flex flex-col items-center">
                      <span className="text-[26px] font-extrabold text-white">{netZeroProgress}%</span>
                      <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">달성 완료</span>
                    </div>

                    <ResponsiveContainer width="100%" height="100%">
                      <RadialBarChart 
                        cx="50%" 
                        cy="50%" 
                        innerRadius="80%" 
                        outerRadius="100%" 
                        barSize={8} 
                        data={progressChartData} 
                        startAngle={90} 
                        endAngle={-270}
                      >
                        <defs>
                          <linearGradient id="radialGreen" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stopColor="#10b981" />
                            <stop offset="100%" stopColor="#0ea5e9" />
                          </linearGradient>
                        </defs>
                        <RadialBar 
                          minAngle={15} 
                          background={{ fill: '#1e293b' }} 
                          clockWise 
                          dataKey="value" 
                          cornerRadius={4}
                        />
                      </RadialBarChart>
                    </ResponsiveContainer>
                  </div>

                  {/* Message and info */}
                  <div className="text-center sm:text-left space-y-2">
                    <span className="px-3 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-bold rounded-full border border-emerald-500/20">
                      목표: 2030년까지 넷제로(Net-Zero) 달성
                    </span>
                    <h3 className="text-xl font-extrabold text-slate-100 pt-1">
                      탄소 중립 달성 진척도 현황
                    </h3>
                    <p className="text-xs text-slate-400 leading-relaxed max-w-md font-medium">
                      현재 매우 우수한 친환경 친화 등급에 위치해 있습니다! 전력 소비량을 피크 타임에 조절하고, 탄소 흡수 수종 식재 및 마일스톤 확장을 통해 탄소 배출량을 더욱 억제해 주세요.
                    </p>
                    <div className="flex flex-wrap gap-4 text-xs font-semibold text-slate-300 pt-1 justify-center sm:justify-start">
                      <div className="flex items-center gap-1.5">
                        <span className="p-0.5 bg-emerald-500/10 text-emerald-400 rounded">
                          <LeafIcon className="w-3.5 h-3.5" />
                        </span>
                        <span>탄소 12% 추가 절감 필요</span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <span className="p-0.5 bg-sky-500/10 text-sky-400 rounded">
                          <WindIcon className="w-3.5 h-3.5" />
                        </span>
                        <span>탄소 상쇄량 +25kg 이상 유지</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Milestone reduction checklist (Interactive!) */}
                <div className="flex-1 flex flex-col justify-between">
                  <div>
                    <h3 className="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">
                      <span>탄소 감축 및 상쇄 마일스톤</span>
                      <span className="text-[10px] text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded-full ml-auto">
                        실시간 목표치 변동 반영
                      </span>
                    </h3>
                    <div className="space-y-2.5">
                      {milestones.map((m) => (
                        <label 
                          key={m.id}
                          className={`flex items-center gap-3 p-2.5 rounded-xl border transition-all duration-300 cursor-pointer ${m.checked ? 'bg-emerald-950/20 border-emerald-500/20 hover:border-emerald-500/30' : 'bg-slate-950/40 border-slate-900 hover:border-slate-800'}`}
                        >
                          <input 
                            type="checkbox" 
                            checked={m.checked}
                            onChange={() => toggleMilestone(m.id)}
                            className="h-4 w-4 rounded border-slate-800 text-emerald-500 focus:ring-emerald-500/50 bg-slate-950 accent-emerald-500"
                          />
                          <span className={`text-xs font-medium transition-colors ${m.checked ? 'text-slate-200 line-through decoration-slate-600' : 'text-slate-400'}`}>
                            {m.label}
                          </span>
                          <span className="text-[9px] font-bold text-slate-500 ml-auto uppercase tracking-wider">
                            진척도 +{m.points}% 기여
                          </span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>

              </div>
            </section>

          </div>

          {/* Footer Copyright */}
          <footer className="text-center text-[10px] text-slate-600 font-semibold py-8 tracking-wider">
            &copy; 2026 ECOPULSE 통합 환경 관제 제어 시스템. ALL RIGHTS RESERVED.
          </footer>

        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
