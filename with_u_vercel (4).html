<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WITH_U 통합 탄소 플랫폼</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Dashboard Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Recharts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind Configuration with Soft Earth Tones -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'Noto Sans KR', 'sans-serif'] },
          colors: {
            sage: { 50: '#f4f6f5', 100: '#e5ebe8', 200: '#cbdad3', 300: '#a7c1b5', 400: '#7fa292', 500: '#608675', 600: '#4c6b5e', 700: '#3f564d', 800: '#34463f', 900: '#2b3a35' },
            clay: { 50: '#f9f6f6', 100: '#f2eae9', 200: '#e3d0cf', 300: '#cfadab', 400: '#b8827f', 500: '#a35f5c', 600: '#8b4b48', 700: '#743f3d' },
            sand: { 50: '#fefcf8', 100: '#fdfbf7', 200: '#f4ecd8', 300: '#e5d1a4', 400: '#d1b26f', 500: '#bd9446', 600: '#a07d3b' },
            dust: { 50: '#f5f7f9', 100: '#f0f4f8', 200: '#d9e2eb', 300: '#b4c8d9', 400: '#8aa9c4', 500: '#698db0', 600: '#527194', 700: '#435c7a' }
          },
          animation: {
            'blob': 'blob 10s infinite alternate',
            'blob-delayed': 'blob 12s infinite alternate-reverse 2s',
            'blob-slow': 'blob 14s infinite alternate 4s',
            'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            blob: { 
                '0%': { transform: 'translate(0px, 0px) scale(1)' }, 
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' }, 
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' }, 
                '100%': { transform: 'translate(0px, 0px) scale(1)' } 
            },
            fadeInUp: {
              '0%': { opacity: 0, transform: 'translateY(20px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS for Premium Light Glassmorphism -->
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(244, 244, 245, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(167, 193, 181, 0.5); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(96, 134, 117, 0.8); }

    /* 편안한 웜 톤 (아이보리~세이지) 그라데이션 고정 배경 */
    body { 
        background: linear-gradient(135deg, #fdfcfb 0%, #f4f5f4 40%, #e9ecea 100%);
        background-attachment: fixed;
        color: #3f3f46; /* zinc-700 */
        overflow-x: hidden; 
    }

    /* 한층 더 부드러워진 유리 질감 패널 */
    .glass-panel { 
        background: rgba(255, 255, 255, 0.55); 
        backdrop-filter: blur(20px); 
        -webkit-backdrop-filter: blur(20px); 
        border: 1px solid rgba(255, 255, 255, 0.8); 
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.03); 
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-panel:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 40px -10px rgba(96, 134, 117, 0.08); /* sage tinted shadow */
    }

    .glass-input { 
        background: rgba(255, 255, 255, 0.7); 
        border: 1px solid rgba(255, 255, 255, 1); 
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        color: #3f3f46; 
        transition: all 0.3s ease; 
    }
    .glass-input:focus { 
        border-color: rgba(96, 134, 117, 0.5); /* sage-500 */
        outline: none; 
        box-shadow: 0 0 0 4px rgba(96, 134, 117, 0.1), inset 0 2px 4px rgba(0,0,0,0.01); 
    }

    /* 다이내믹 배경 블롭 (opacity 감소로 눈부심 방지) */
    .bg-blob { 
        filter: blur(120px); 
        opacity: 0.3; 
        mix-blend-mode: multiply; 
        pointer-events: none; 
        position: fixed; 
        z-index: 0; 
        border-radius: 50%;
    }

    /* 사이드바 스타일링 */
    .wu-sidebar { 
        position: fixed; top: 0; left: 0; width: max(248px, 20vw); height: 100vh; 
        background: rgba(255, 255, 255, 0.75); 
        border-right: 1px solid rgba(255, 255, 255, 1); 
        z-index: 50; 
        transition: transform 0.3s ease; 
        backdrop-filter: blur(30px); 
        -webkit-backdrop-filter: blur(30px);
        box-shadow: 10px 0 30px rgba(0,0,0,0.02); 
    }
    .wu-main { margin-left: max(248px, 20vw); min-height: 100vh; position: relative; z-index: 10; display: flex; flex-direction: column; }
    
    @media (max-width: 900px) {
      .wu-sidebar { transform: translateX(-100%); width: 248px; }
      .wu-sidebar.open { transform: translateX(0); }
      .wu-main { margin-left: 0; }
    }

    .fade-in { animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    
    .pulse-bg { animation: pulseBg 3s infinite; }
    @keyframes pulseBg { 0% { box-shadow: 0 0 0 0 rgba(96, 134, 117, 0.3); } 70% { box-shadow: 0 0 0 10px rgba(96, 134, 117, 0); } 100% { box-shadow: 0 0 0 0 rgba(96, 134, 117, 0); } }
  </style>
</head>
<body class="antialiased">

  <!-- 다이내믹 매쉬 그레이디언트 블롭 (눈이 편안한 파스텔톤) -->
  <div class="bg-blob w-[500px] h-[500px] bg-sage-300 top-[-15%] left-[-10%] animate-blob"></div>
  <div class="bg-blob w-[600px] h-[600px] bg-dust-200 top-[20%] right-[-15%] animate-blob-delayed"></div>
  <div class="bg-blob w-[400px] h-[400px] bg-sand-200 bottom-[-10%] left-[20%] animate-blob-slow"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { ResponsiveContainer, AreaChart, Area, BarChart, Bar, Cell, PieChart, Pie, XAxis, YAxis, Tooltip: RechartsTooltip, CartesianGrid } = window.Recharts;

    const Icons = {
      Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>,
      Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
      Impact: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" /></svg>,
      Cert: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
    };

    const emissions24hData = [
      { time: "00:00", value: 10 }, { time: "03:00", value: null }, 
      { time: "06:00", value: 15 }, { time: "09:00", value: 35 },
      { time: "12:00", value: 40 }, { time: "15:00", value: 38 },
      { time: "18:00", value: 25 }, { time: "21:00", value: 18 }, { time: "24:00", value: 12 }
    ];

    const ledgerData = [
      { serial: "KOC-2025-8491", registry: "환경부 (KOC)", qty: 5, vintage: "2024", issueDate: "2025-11-20", status: "소각 확정", processDate: "2026-08-10" },
      { serial: "KCS-26-0042", registry: "대한상공회의소 (KCS)", qty: 2, vintage: "2025", issueDate: "2026-01-15", status: "소각 확정", processDate: "2026-08-12" },
      { serial: "KAU-26-1029", registry: "K-ETS (할당배출권)", qty: 10, vintage: "2026", issueDate: "2026-03-20", status: "보유", processDate: "-" },
      { serial: "VCS-981-2025", registry: "Verra (VCS)", qty: 4, vintage: "2025", issueDate: "2026-04-11", status: "이전", processDate: "2026-07-01" },
      { serial: "GS-VER-2026-11", registry: "Gold Standard", qty: 3, vintage: "2026", issueDate: "2026-05-10", status: "보유", processDate: "-" },
      { serial: "KOC-2024-1123", registry: "환경부 (KOC)", qty: 1, vintage: "2024", issueDate: "2025-02-15", status: "이전", processDate: "2025-09-20" },
    ];

    // --- Hero Landing Component ---
    const HeroLanding = ({ navigateTo }) => {
      return (
        <div className="flex flex-col items-center justify-center min-h-[80vh] w-full relative z-10 px-4">
          <div className="animate-fade-in-up flex flex-col items-center text-center max-w-4xl mx-auto">
            {/* Badge */}
            <div className="mb-8 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/70 border border-zinc-200/50 shadow-sm backdrop-blur-md">
              <span className="w-2 h-2 rounded-full bg-sage-500 animate-pulse"></span>
              <span className="text-xs font-bold text-zinc-500 tracking-widest uppercase">2026 ESG PROJECT · PROTOTYPE</span>
            </div>

            {/* Main Title */}
            <h1 className="text-5xl md:text-6xl lg:text-7xl font-extrabold text-zinc-800 tracking-tight leading-tight mb-6">
              WITH_U <span className="text-sage-600">통합 탄소 플랫폼</span>
            </h1>

            {/* Subtitle */}
            <div className="flex flex-col items-center mb-8">
              <h2 className="text-2xl md:text-3xl font-bold text-zinc-600 tracking-tight">
                배출과 상쇄를 상계 없이, 한 흐름으로
              </h2>
              <div className="h-1 w-16 bg-sage-400 mt-4 rounded-full"></div>
            </div>

            {/* Description */}
            <p className="text-base md:text-lg text-zinc-500 font-medium max-w-2xl leading-relaxed mb-12">
              실시간 계측으로 실제 배출량을 재고, 크레딧 소각으로 확보한 상쇄량을 별도로 집계하고, 그 결과를 누구나 이해하는 일상 지표로 환산합니다.
            </p>

            {/* Action Buttons */}
            <div className="flex flex-col sm:flex-row items-center justify-center gap-4 w-full">
              <button 
                onClick={() => navigateTo('dashboard')}
                className="w-full sm:w-auto px-6 py-3 bg-white hover:bg-zinc-50 border border-zinc-200 rounded-full shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-3 group"
              >
                <span className="w-2.5 h-2.5 rounded-full bg-sage-500 group-hover:scale-125 transition-transform"></span>
                <span className="text-sm font-bold text-zinc-700">통합 탄소 대시보드</span>
              </button>
              
              <button 
                onClick={() => navigateTo('impact')}
                className="w-full sm:w-auto px-6 py-3 bg-white hover:bg-zinc-50 border border-zinc-200 rounded-full shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-3 group"
              >
                <span className="w-2.5 h-2.5 rounded-full bg-dust-500 group-hover:scale-125 transition-transform"></span>
                <span className="text-sm font-bold text-zinc-700">ESG 공공 성과 지표</span>
              </button>

              <button 
                onClick={() => navigateTo('verify')}
                className="w-full sm:w-auto px-6 py-3 bg-white hover:bg-zinc-50 border border-zinc-200 rounded-full shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-3 group"
              >
                <span className="w-2.5 h-2.5 rounded-full bg-sand-500 group-hover:scale-125 transition-transform"></span>
                <span className="text-sm font-bold text-zinc-700">공식 인증서 검증</span>
              </button>
            </div>

            {/* Footer hint */}
            <p className="mt-16 text-xs text-zinc-400 font-medium">
              &larr; 왼쪽 사이드바에서 언제든 <strong className="text-zinc-500">세 개의 서비스</strong>를 이동할 수 있습니다
            </p>
          </div>
        </div>
      );
    };

    // --- Carbon Dashboard Component ---
    const CarbonDashboard = () => {
      const [period, setPeriod] = useState('monthly');
      const [inputs, setInputs] = useState({ gasoline: 150, diesel: 50, lng: 45, electricity: 342, waste: 0.1 });
      const [verifyState, setVerifyState] = useState('unverified'); 

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setInputs(prev => ({ ...prev, [name]: parseFloat(value) || 0 }));
      };
      
      const handleCrossVerify = () => {
        setVerifyState('loading');
        setTimeout(() => {
          setVerifyState('verified');
        }, 2500); 
      };
      
      const FACTORS = { gasoline: 2.15, diesel: 2.62, lng: 2.2, electricity: 0.46, waste: 500.0 };
      
      const emissions = useMemo(() => ({
        gasoline: inputs.gasoline * FACTORS.gasoline,
        diesel: inputs.diesel * FACTORS.diesel,
        lng: inputs.lng * FACTORS.lng,
        electricity: inputs.electricity * FACTORS.electricity,
        waste: inputs.waste * FACTORS.waste
      }), [inputs]);
      
      const totalCarbon = Object.values(emissions).reduce((a, b) => a + b, 0);

      const heldQty = ledgerData.filter(row => row.status.includes('보유')).reduce((sum, row) => sum + row.qty, 0);
      const transferredQty = ledgerData.filter(row => row.status.includes('이전')).reduce((sum, row) => sum + row.qty, 0);
      const retiredQty = ledgerData.filter(row => row.status.includes('소각')).reduce((sum, row) => sum + row.qty, 0);

      const pieData = [
        { name: '전력 (Scope 2)', value: parseFloat(emissions.electricity.toFixed(1)), color: '#608675' }, // sage-500
        { name: 'LNG (Scope 1)', value: parseFloat(emissions.lng.toFixed(1)), color: '#8aa9c4' }, // dust-400
        { name: '차량 (Scope 1)', value: parseFloat((emissions.gasoline + emissions.diesel).toFixed(1)), color: '#3f564d' }, // sage-700
        { name: '폐기물 (Scope 3)', value: parseFloat(emissions.waste.toFixed(1)), color: '#527194' } // dust-600
      ].filter(d => d.value > 0);

      const periodDisplay = { monthly: "당월(월간)", quarterly: "분기", annual: "연간" };
      const p_label = periodDisplay[period];

      return (
        <div className="space-y-8 fade-in">
          <header className="mb-4">
            <h1 className="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sage-600 via-sage-500 to-dust-500 tracking-tight">
              WITH_U 통합 탄소 대시보드
            </h1>
            <p className="text-sm text-zinc-500 mt-2 font-medium">
              자발적 상쇄와 실제 배출량을 엄격히 분리하여 관리하는 차세대 회계 모델
            </p>
          </header>

          <section className="glass-panel p-8 flex flex-col gap-5 rounded-3xl">
            <div className="bg-white/60 backdrop-blur-md border border-clay-100 rounded-2xl p-6 flex flex-col md:flex-row items-start md:items-center justify-between shadow-sm">
              <div>
                <h3 className="text-clay-600 font-bold flex items-center gap-2 text-lg">
                  <span className="w-2.5 h-2.5 rounded-full bg-clay-500 animate-pulse shadow-[0_0_8px_rgba(163,95,92,0.5)]"></span>
                  {p_label} 실제 탄소 배출량 [계측]
                </h3>
                <p className="text-xs text-zinc-500 mt-1.5 font-medium">사업장에서 실제로 대기 중에 배출한 {period === 'annual' ? '연간 ' : period === 'quarterly' ? '분기 ' : '당월 '}탄소의 총량입니다.</p>
              </div>
              <div className="text-right mt-4 md:mt-0">
                <div className="text-4xl font-black text-clay-700 tracking-tight">
                  {totalCarbon.toFixed(1)} <span className="text-base font-bold text-clay-400">kgCO₂eq</span>
                </div>
                <div className="text-xs text-clay-600 font-bold mt-1 bg-clay-50 px-3 py-1 rounded-full inline-block border border-clay-100">= {(totalCarbon / 1000).toFixed(3)} tCO₂e</div>
              </div>
            </div>

            <div className="relative flex items-center justify-center py-1">
              <div className="absolute w-full border-t border-dashed border-zinc-300"></div>
              <div className="relative bg-zinc-50 px-4 py-1.5 rounded-full text-[10px] font-extrabold text-zinc-500 border border-zinc-200 tracking-widest uppercase shadow-sm">
                상계 불가 원칙 적용 (No Netting)
              </div>
            </div>

            <div className="bg-white/60 backdrop-blur-md border border-sage-100 rounded-2xl p-6 flex flex-col md:flex-row items-start md:items-center justify-between shadow-sm">
              <div>
                <h3 className="text-sage-700 font-bold flex items-center flex-wrap gap-2 text-lg">
                  <span className="w-2.5 h-2.5 rounded-full bg-sage-500 shadow-[0_0_8px_rgba(96,134,117,0.5)]"></span>
                  누적 탄소 상쇄량 · Retirement 
                  
                  <div className="inline-flex items-center gap-1.5 ml-2">
                    {verifyState === 'unverified' && (
                      <>
                        <span className="bg-zinc-100 border border-zinc-200 text-[10px] px-2.5 py-0.5 rounded-md text-zinc-500 shadow-sm font-bold">미검증</span>
                        <button onClick={handleCrossVerify} className="flex items-center gap-1 text-[10px] px-2.5 py-0.5 bg-sage-50 hover:bg-sage-100 text-sage-700 border border-sage-200 rounded-md shadow-sm transition-colors font-bold">
                          <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                          원장 교차 검증
                        </button>
                      </>
                    )}
                    {verifyState === 'loading' && (
                      <span className="bg-sage-50 border border-sage-200 text-[10px] px-3 py-1 rounded-md text-sage-700 shadow-sm flex items-center gap-1.5 font-bold">
                        <svg className="animate-spin w-3.5 h-3.5 text-sage-600" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        RPA/서류 대조 중...
                      </span>
                    )}
                    {verifyState === 'verified' && (
                      <span className="bg-sage-600 border border-sage-700 text-[10px] px-3 py-1 rounded-md text-white shadow-md font-bold flex items-center gap-1.5" style={{ animation: 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) 3' }}>
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>
                        공식 검증 완료
                      </span>
                    )}
                  </div>
                </h3>
                <p className="text-xs text-zinc-500 mt-1.5 font-medium">소각이 확정되어 재판매 및 재사용이 불가한 외부 감축 실적입니다.</p>
              </div>
              <div className="text-right mt-4 md:mt-0">
                <div className="text-4xl font-black text-sage-700 tracking-tight">
                  {(retiredQty * 1000).toLocaleString()} <span className="text-base font-bold text-sage-500">kgCO₂eq</span>
                </div>
                <div className="text-xs text-sage-600 font-bold mt-1 bg-sage-50 px-3 py-1 rounded-full inline-block border border-sage-100">= {retiredQty.toLocaleString()} 크레딧 (1 Credit = 1 tCO₂e)</div>
              </div>
            </div>
          </section>

          <section className="glass-panel p-8 rounded-3xl">

    const CertVerify = () => {
      const [certInput, setCertInput] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);
      const [res, setRes] = useState(null);
      const [showCode, setShowCode] = useState(false);

      const rpaPythonCode = `"""
RPA 웹 스크래퍼 (Selenium 기반)
- 목적: API가 없는 탄소 배출권 등록부 웹사이트에 봇이 접근하여 인증서 유효성을 추출
"""
import time
from selenium import webdriver
from selenium.webdriver.common.by import By
from selenium.webdriver.chrome.options import Options
from selenium.webdriver.support.ui import WebDriverWait
from selenium.webdriver.support import expected_conditions as EC

class CarbonRegistryRPABot:
    def __init__(self):
        chrome_options = Options()
        chrome_options.add_argument("--headless")
        self.driver = webdriver.Chrome(options=chrome_options)
        
    def verify_certificate(self, serial_number: str) -> dict:
        target_url = "https://example-carbon-registry.com/search"
        try:
            self.driver.get(target_url)
            
            # 검색창 찾기 및 일련번호 입력
            search_box = WebDriverWait(self.driver, 5).until(
                EC.presence_of_element_located((By.ID, "serial_search_box"))
            )
            search_box.clear()
            search_box.send_keys(serial_number)
            self.driver.find_element(By.CLASS_NAME, "btn-search").click()
            
            # 결과 로딩 대기 및 데이터 추출
            WebDriverWait(self.driver, 5).until(
                EC.presence_of_element_located((By.ID, "result_panel"))
            )
            
            return {
                "success": True,
                "serial": serial_number,
                "status": self.driver.find_element(By.ID, "result_status").text,
                "issuer": self.driver.find_element(By.CLASS_NAME, "issuer-name").text,
                "offset": self.driver.find_element(By.CLASS_NAME, "offset-amount").text
            }
        except Exception as e:
            return {"success": False, "message": str(e)}
            
    def close(self):
        self.driver.quit()`;

      const handleVerify = (e) => {
        e.preventDefault();
        if (!certInput.trim()) return;
        setIsVerifying(true); setRes(null);
        
        setTimeout(() => {
          setIsVerifying(false);
          
          let determinedIssuer = '대한상공회의소 (KCS)';
          const upperInput = certInput.toUpperCase();
          
          if (upperInput.includes('KOC') || upperInput.includes('KETS') || upperInput.includes('KAU')) {
              determinedIssuer = '환경부 (온실가스종합정보센터)';
          } else if (upperInput.includes('KCS')) {
              determinedIssuer = '대한상공회의소 (KCS)';
          } else if (upperInput.includes('VCS') || upperInput.includes('VERRA')) {
              determinedIssuer = 'Verra (VCS)';
          } else if (upperInput.includes('GS') || upperInput.includes('GOLD')) {
              determinedIssuer = 'Gold Standard';
          }

          const randomQty = Math.max(1, Math.floor(certInput.length * 1.5 + Math.random() * 5));

          setRes({ 
            serial: certInput, 
            status: '정상 인증 확인 (Verified)', 
            issuer: determinedIssuer + ' (RPA 추출 완료)', 
            offset: `${randomQty} tCO₂eq` 
          });
        }, 2500);
      };

      return (
        <div className="max-w-3xl mx-auto glass-panel rounded-3xl p-10 mt-10 fade-in">
          <div className="flex items-center gap-3 mb-3">
            <h2 className="text-2xl font-black text-zinc-700">공식 인증서 검증 (RPA 크롤링 연동)</h2>
            <span className="px-3 py-1 rounded-full text-[10px] font-extrabold bg-dust-100 text-dust-600 border border-dust-200 shadow-sm uppercase tracking-wider">RPA Bot Active</span>
          </div>
          <p className="text-sm text-zinc-500 mb-8 font-medium">등록부 공개 API 미지원 한계를 극복하기 위해 <span className="text-dust-600 font-bold bg-dust-50 px-1.5 py-0.5 rounded">RPA(웹 스크래핑) 봇</span>이 백그라운드에서 해당 기관 웹사이트에 직접 접속하여 인증 데이터를 실시간으로 추출합니다.</p>
          
          <form onSubmit={handleVerify} className="flex flex-col sm:flex-row gap-3 mb-8">
            <input type="text" value={certInput} onChange={e => setCertInput(e.target.value)} placeholder="일련번호 입력 (예: KOC-2026-001, VCS-981)" className="flex-1 glass-input rounded-xl px-5 py-4 text-base font-mono shadow-sm" />
            <button type="submit" disabled={isVerifying} className="bg-gradient-to-r from-sage-500 to-sage-600 text-white font-bold px-8 py-4 rounded-xl hover:from-sage-400 hover:to-sage-500 transition-all flex items-center justify-center min-w-[160px] shadow-lg shadow-sage-500/20 active:scale-95 disabled:opacity-70 disabled:pointer-events-none text-base">
              {isVerifying ? (
                <div className="flex items-center gap-2">
                  <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  <span>스크래핑 중...</span>
                </div>
              ) : 'RPA 봇 조회'}
            </button>
          </form>

          {isVerifying && (
            <div className="bg-zinc-800 border border-zinc-700 rounded-xl p-5 text-xs text-sage-400 font-mono flex flex-col gap-2 mt-4 shadow-inner">
              <p>&gt; Initialize RPA Bot Engine v2.4...</p>
              <p className="animate-pulse text-dust-300">&gt; Accessing registry database URL over secure proxy...</p>
              <p className="animate-pulse text-sand-300" style={{animationDelay: '0.5s'}}>&gt; Parsing HTML DOM elements for serial: [{certInput}]</p>
            </div>
          )}

          {res && !isVerifying && (
            <div className="bg-white/80 border border-sage-200 rounded-2xl p-8 text-center shadow-xl shadow-sage-500/10 transform transition-all hover:scale-[1.02]">
              <div className="w-16 h-16 rounded-full bg-sage-100 flex items-center justify-center mx-auto mb-4 text-sage-600 shadow-inner">
                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>
              </div>
              <h3 className="text-2xl font-black text-sage-700">{res.status}</h3>
              <div className="mt-4 bg-zinc-50 p-4 rounded-xl inline-block text-left border border-zinc-100">
                <p className="text-zinc-600 text-sm mb-1">발행처: <strong className="text-zinc-700">{res.issuer}</strong></p>
                <p className="text-zinc-600 text-sm">상쇄량: <strong className="text-sage-600 text-lg">{res.offset}</strong></p>
              </div>
              <p className="text-[10px] text-zinc-400 mt-5 bg-zinc-100/50 inline-block px-3 py-1 rounded-full">* 본 데이터는 웹 스크래핑을 통해 수집된 데이터로 법적 효력을 보장하지 않습니다.</p>
            </div>
          )}

          <div className="mt-10 pt-8 border-t border-zinc-200/60">
            <button 
              onClick={() => setShowCode(!showCode)}
              className="flex items-center justify-center w-full gap-2 text-sm font-bold text-dust-700 hover:text-white transition-all bg-dust-50 hover:bg-dust-500 px-4 py-3 rounded-xl border border-dust-200 hover:shadow-lg shadow-dust-500/20"
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
              </svg>
              {showCode ? '백엔드 RPA 파이썬 소스 코드 숨기기' : '👨‍💻 백엔드 RPA 파이썬 소스 코드 확인하기 (개발자 모드)'}
            </button>
            
            {showCode && (
              <div className="mt-4 bg-[#27272a] border border-zinc-700 rounded-2xl p-5 overflow-x-auto text-left relative shadow-2xl">
                <div className="absolute top-0 right-0 px-4 py-1.5 bg-zinc-700 text-xs text-dust-300 font-bold rounded-bl-xl rounded-tr-2xl uppercase tracking-wider">Python</div>
                <pre className="text-xs md:text-sm font-mono text-sage-300/90 leading-relaxed whitespace-pre-wrap mt-2">
                  {rpaPythonCode}
                </pre>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- Impact Dashboard Component ---
    const ImpactDashboard = () => {
      const [inputVal, setInputVal] = useState(12500);
      const [targetVal, setTargetVal] = useState(12500);
      const [currentTime, setCurrentTime] = useState('');

      useEffect(() => {
        const now = new Date();
        setCurrentTime(`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
      }, []);

      const useAnimatedValue = (target, duration, isFloat = false) => {
        const [val, setVal] = useState(0);
        useEffect(() => {
          let start = null;
          let animationFrameId;
          const step = (timestamp) => {
            if (!start) start = timestamp;
            const progress = Math.min((timestamp - start) / duration, 1);
            const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
            setVal(ease * target);
            if (progress < 1) {
                animationFrameId = window.requestAnimationFrame(step);
            }
          };
          animationFrameId = window.requestAnimationFrame(step);
          return () => window.cancelAnimationFrame(animationFrameId);
        }, [target, duration]);
        
        return isFloat ? val.toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g, ",") : Math.floor(val).toLocaleString();
      };

      return (
        <div className="w-full bg-white/70 backdrop-blur-xl rounded-3xl shadow-xl shadow-zinc-200/40 overflow-hidden border border-white fade-in">

                </div>
                <div className="text-sage-100/80 text-xs md:text-sm bg-white/5 px-4 py-2 rounded-full border border-white/10">
                    최종 업데이트: <span className="font-mono ml-1">{currentTime}</span>

            <div className="relative z-10">
                <h1 className="text-3xl md:text-4xl lg:text-5xl font-black mb-4 tracking-tight leading-tight">지구를 위한<br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-sage-300 to-dust-300">탄소 감축 성과</span></h1>
                <p className="text-sage-100 text-sm md:text-base max-w-2xl font-light leading-relaxed">
                    파이썬 엔진이 산출한 통합 탄소 상쇄량을 누구나 이해하기 쉬운 일상 속 지표로 변환하여 보여줍니다.

                <label className="block text-sm font-bold text-zinc-600 mb-4 uppercase tracking-wide flex items-center gap-2">
                    <span className="p-1.5 bg-sage-100 text-sage-600 rounded-lg"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg></span>
                    엔진 산출 결과 시뮬레이션 (Total Offset kgCO₂eq)
                </label>
                <div className="flex flex-col sm:flex-row gap-4">
                    <div className="relative flex-1">
                        <input type="number" value={inputVal} onChange={e => setInputVal(Number(e.target.value))} min="0" step="100" 
                            className="block w-full pl-6 pr-4 py-4 bg-zinc-50 border border-zinc-300 rounded-xl text-xl font-black text-zinc-700 focus:ring-4 focus:ring-sage-500/20 focus:border-sage-500 outline-none transition-all shadow-inner" 
                            placeholder="예: 12500" />
                    </div>
                    <button onClick={() => setTargetVal(inputVal)}
                        className="bg-zinc-800 hover:bg-sage-600 text-white font-bold py-4 px-8 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2 whitespace-nowrap active:scale-95 text-lg">
                        성과 반영하기
                    </button>
                </div>
            </div>
          </div>

          <div className="p-8 md:p-12">
            <div className="text-center mb-16">
                <h2 className="text-zinc-400 font-extrabold tracking-widest uppercase mb-4 text-sm md:text-base">누적 탄소 감축 효과</h2>
                <div className="inline-flex items-baseline justify-center gap-3 bg-gradient-to-r from-sage-50 to-zinc-50 px-10 py-6 rounded-3xl border border-sage-200 shadow-sm">
                    <span className="text-6xl md:text-8xl font-black text-sage-800 tracking-tighter drop-shadow-sm">{useAnimatedValue(targetVal, 1500)}</span>
                    <span className="text-2xl md:text-3xl font-black text-sage-600">kgCO₂</span>
                </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                {/* Metric 1 */}
                <div className="bg-white rounded-3xl border border-zinc-100 p-8 flex flex-col items-center text-center relative overflow-hidden shadow-md hover:shadow-sage-500/10 hover:-translate-y-1 transition-all duration-300 group">
                    <div className="absolute -top-10 -right-10 w-32 h-32 bg-sage-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    <div className="w-20 h-20 bg-sage-100 text-sage-600 rounded-2xl flex items-center justify-center text-4xl mb-6 shadow-sm transform group-hover:rotate-3 transition-transform"><i className="fa-solid fa-tree"></i></div>
                    <h3 className="text-zinc-700 font-black text-xl mb-2">30년생 소나무 식재</h3>
                    <div className="flex items-baseline gap-1.5 mb-5 mt-2">
                        <span className="text-4xl md:text-5xl font-black text-sage-600 tracking-tight">{useAnimatedValue(targetVal / 6.6, 1500)}</span>
                        <span className="text-lg text-zinc-400 font-bold">그루</span>
                    </div>
                    <p className="text-xs text-zinc-400 mt-auto bg-zinc-50 px-4 py-2.5 rounded-xl w-full border border-zinc-100 font-medium">소나무 1그루 연 6.6kg 흡수 기준</p>
                </div>
                
                {/* Metric 2 */}
                <div className="bg-white rounded-3xl border border-zinc-100 p-8 flex flex-col items-center text-center relative overflow-hidden shadow-md hover:shadow-dust-500/10 hover:-translate-y-1 transition-all duration-300 group">
                    <div className="absolute -top-10 -right-10 w-32 h-32 bg-dust-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    <div className="w-20 h-20 bg-dust-100 text-dust-600 rounded-2xl flex items-center justify-center text-4xl mb-6 shadow-sm transform group-hover:-rotate-3 transition-transform"><i className="fa-solid fa-car-side"></i></div>
                    <h3 className="text-zinc-700 font-black text-xl mb-2">승용차 운행 정지</h3>
                    <div className="flex items-baseline gap-1.5 mb-5 mt-2">
                        <span className="text-4xl md:text-5xl font-black text-dust-600 tracking-tight">{useAnimatedValue(targetVal / 2400.0, 1800, true)}</span>
                        <span className="text-lg text-zinc-400 font-bold">대 / 1년</span>
                    </div>
                    <p className="text-xs text-zinc-400 mt-auto bg-zinc-50 px-4 py-2.5 rounded-xl w-full border border-zinc-100 font-medium">연 1.5만km 2.4톤 배출 기준</p>
                </div>

                {/* Metric 3 */}
                <div className="bg-white rounded-3xl border border-zinc-100 p-8 flex flex-col items-center text-center relative overflow-hidden shadow-md hover:shadow-zinc-500/10 hover:-translate-y-1 transition-all duration-300 group">
                    <div className="absolute -top-10 -right-10 w-32 h-32 bg-zinc-100 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    <div className="w-20 h-20 bg-zinc-100 text-zinc-500 rounded-2xl flex items-center justify-center text-4xl mb-6 shadow-sm transform group-hover:rotate-3 transition-transform"><i className="fa-solid fa-mobile-screen-button"></i></div>
                    <h3 className="text-zinc-700 font-black text-xl mb-2">스마트폰 완전 충전</h3>
                    <div className="flex items-baseline gap-1.5 mb-5 mt-2">
                        <span className="text-4xl md:text-5xl font-black text-zinc-600 tracking-tight">{useAnimatedValue(targetVal / 0.008, 2100)}</span>
                        <span className="text-lg text-zinc-400 font-bold">회 분량</span>
                    </div>
                    <p className="text-xs text-zinc-400 mt-auto bg-zinc-50 px-4 py-2.5 rounded-xl w-full border border-zinc-100 font-medium">1회 약 8g 배출 기준 (EPA)</p>
                </div>

                {/* Metric 4 */}
                <div className="bg-white rounded-3xl border border-zinc-100 p-8 flex flex-col items-center text-center relative overflow-hidden shadow-md hover:shadow-sand-500/10 hover:-translate-y-1 transition-all duration-300 group">
                    <div className="absolute -top-10 -right-10 w-32 h-32 bg-sand-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    <div className="w-20 h-20 bg-sand-100 text-sand-600 rounded-2xl flex items-center justify-center text-4xl mb-6 shadow-sm transform group-hover:-rotate-3 transition-transform"><i className="fa-solid fa-bottle-water"></i></div>
                    <h3 className="text-zinc-700 font-black text-xl mb-2">일회용 플라스틱 용기</h3>
                    <div className="flex items-baseline gap-1.5 mb-5 mt-2">
                        <span className="text-4xl md:text-5xl font-black text-sand-600 tracking-tight">{useAnimatedValue(targetVal / 0.052, 2400)}</span>
                        <span className="text-lg text-zinc-400 font-bold">개 절약</span>
                    </div>
                    <p className="text-xs text-zinc-400 mt-auto bg-zinc-50 px-4 py-2.5 rounded-xl w-full border border-zinc-100 font-medium">컵 1개당 약 52g 배출 기준</p>
                </div>

                {/* Metric 5 */}
                <div className="bg-white rounded-3xl border border-zinc-100 p-8 flex flex-col items-center text-center relative overflow-hidden shadow-md hover:shadow-clay-500/10 hover:-translate-y-1 transition-all duration-300 group">
                    <div className="absolute -top-10 -right-10 w-32 h-32 bg-clay-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    <div className="w-20 h-20 bg-clay-100 text-clay-600 rounded-2xl flex items-center justify-center text-4xl mb-6 shadow-sm transform group-hover:rotate-3 transition-transform"><i className="fa-solid fa-burger"></i></div>
                    <h3 className="text-zinc-700 font-black text-xl mb-2">소고기 햄버거</h3>
                    <div className="flex items-baseline gap-1.5 mb-5 mt-2">
                        <span className="text-4xl md:text-5xl font-black text-clay-600 tracking-tight">{useAnimatedValue(targetVal / 4.0, 2700)}</span>
                        <span className="text-lg text-zinc-400 font-bold">개 절약</span>
                    </div>
                    <p className="text-xs text-zinc-400 mt-auto bg-zinc-50 px-4 py-2.5 rounded-xl w-full border border-zinc-100 font-medium">버거 1개당 약 4.0kg 배출 기준</p>
                </div>

                {/* Metric 6 */}
                <div className="bg-white rounded-3xl border border-zinc-100 p-8 flex flex-col items-center text-center relative overflow-hidden shadow-md hover:shadow-sage-500/10 hover:-translate-y-1 transition-all duration-300 group">
                    <div className="absolute -top-10 -right-10 w-32 h-32 bg-sage-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    <div className="w-20 h-20 bg-sage-100 text-sage-700 rounded-2xl flex items-center justify-center text-4xl mb-6 shadow-sm transform group-hover:-rotate-3 transition-transform"><i className="fa-solid fa-lightbulb"></i></div>
                    <h3 className="text-zinc-700 font-black text-xl mb-2">4인 가구 한 달 전기</h3>
                    <div className="flex items-baseline gap-1.5 mb-5 mt-2">
                        <span className="text-4xl md:text-5xl font-black text-sage-700 tracking-tight">{useAnimatedValue(targetVal / 138.0, 3000, true)}</span>
                        <span className="text-lg text-zinc-400 font-bold">가구 분량</span>
                    </div>
                    <p className="text-xs text-zinc-400 mt-auto bg-zinc-50 px-4 py-2.5 rounded-xl w-full border border-zinc-100 font-medium">월 300kWh (약 138kg) 기준</p>
                </div>
            </div>
          </div>
        </div>
      );
    };

    // --- Main App Component ---
    const App = () => {
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [currentPath, setCurrentPath] = useState('home');

      const navItems = [
        { id: 'dashboard', label: '통합 탄소 대시보드', icon: <Icons.Dashboard /> },
        { id: 'impact', label: '공공 성과 지표 (Impact)', icon: <Icons.Impact /> },
        { id: 'verify', label: '공식 인증서 검증', icon: <Icons.Cert /> },
      ];

      return (
        <div className="min-h-screen flex">
          {sidebarOpen && (
            <div className="fixed inset-0 bg-zinc-900/40 backdrop-blur-sm z-40 lg:hidden" onClick={() => setSidebarOpen(false)}></div>
          )}

          <aside className={`wu-sidebar flex flex-col py-8 px-5 ${sidebarOpen ? 'open' : ''}`}>
            {/* Clickable Logo */}
            <button 
              onClick={() => { setCurrentPath('home'); setSidebarOpen(false); }}
              className="flex items-center gap-3 px-2 mb-12 hover:opacity-80 transition-opacity text-left w-full group"
            >
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-sage-500 to-sage-600 flex items-center justify-center text-white font-black text-2xl shadow-md group-hover:shadow-lg transition-all">W</div>
              <span className="text-2xl font-black tracking-tight text-zinc-800">WITH_U</span>
            </button>
            
            <nav className="flex-1 space-y-3">
              <div className="text-[10px] font-extrabold text-zinc-400 uppercase tracking-widest px-3 mb-4">Platform Menu</div>
              {navItems.map(item => (
                <button 
                  key={item.id}
                  onClick={() => { setCurrentPath(item.id); setSidebarOpen(false); }}
                  className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-2xl transition-all text-sm font-bold ${currentPath === item.id ? 'bg-white text-sage-700 shadow-sm border border-zinc-100/50 scale-105' : 'text-zinc-500 hover:bg-white/40 hover:text-zinc-800 border border-transparent'}`}
                >
                  {item.icon}
                  {item.label}
                </button>
              ))}
            </nav>
            
            <div className="mt-auto pt-6 border-t border-zinc-200/50">
              <div className="flex items-center gap-3 px-3 bg-white/40 p-3 rounded-2xl border border-zinc-100">
                <div className="w-10 h-10 rounded-full bg-zinc-200/50 flex items-center justify-center border border-zinc-200 shadow-sm text-lg">👤</div>
                <div className="text-xs text-left">
                  <p className="text-zinc-700 font-extrabold text-sm">Admin</p>
                  <p className="text-zinc-400 font-medium">eco_manager</p>
                </div>
              </div>
            </div>
          </aside>

          <main className="wu-main flex-1 w-full p-4 md:p-8 lg:p-10 flex flex-col">
            <div className="lg:hidden flex items-center justify-between mb-6 glass-panel p-4 rounded-2xl">
              <button 
                onClick={() => setCurrentPath('home')}
                className="font-black text-sage-600 flex items-center gap-2 text-lg hover:opacity-80 transition-opacity"
              >
                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-sage-500 to-sage-600 flex items-center justify-center text-white font-black text-base shadow-sm">W</div>
                WITH_U
              </button>
              <button onClick={() => setSidebarOpen(true)} className="text-zinc-500 hover:text-zinc-800 bg-white/50 p-2 rounded-lg shadow-sm"><Icons.Menu /></button>
            </div>

            <div className="max-w-[1200px] mx-auto w-full flex-1 flex flex-col">
              {currentPath === 'home' && <HeroLanding navigateTo={setCurrentPath} />}
              {currentPath === 'dashboard' && <CarbonDashboard />}
              {currentPath === 'verify' && <CertVerify />}
              {currentPath === 'impact' && <ImpactDashboard />}
            </div>
            
            <footer className="mt-16 pt-8 border-t border-zinc-200/50 text-center text-xs text-zinc-400 pb-4 font-semibold tracking-wide">
              © 2026 WITH_U 통합 탄소 플랫폼. (Soft Earth Tones Theme SPA)
            </footer>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
