<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 환경 영향 대시보드 - Eco Bento Dashboard</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS v3 Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Recharts CDN Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  
  <!-- Babel for browser compilation of JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind Custom Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Noto Sans KR', 'sans-serif'],
          },
          colors: {
            slate: {
              950: '#020617',
            },
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
              950: '#022c22',
            },
            sky: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 8s ease-in-out infinite',
            'float-delayed': 'float 8s ease-in-out infinite 4s',
            'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin-slow': 'spin 3s linear infinite',
            'gradient-border': 'gradient-border 4s ease infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-12px)' },
            },
            'gradient-border': {
              '0%, 100%': { 'border-color': 'rgba(16, 185, 129, 0.2)' },
              '50%': { 'border-color': 'rgba(14, 165, 233, 0.4)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Scrollbar Style */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.45);
    }

    body {
      background-color: #020617;
      color: #f1f5f9;
      overflow-x: hidden;
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
    }

    /* Glassmorphism Styles */
    .glass-panel {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
    
    .glass-panel:hover {
      border-color: rgba(16, 185, 129, 0.25);
      box-shadow: 0 10px 35px 0 rgba(16, 185, 129, 0.06);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      transition: all 0.3s ease;
    }
    
    .glass-input:focus {
      border-color: rgba(16, 185, 129, 0.6);
      outline: none;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
      background: rgba(15, 23, 42, 0.9);
    }

    /* Dynamic Blobs in Background */
    .bg-blob {
      filter: blur(120px);
      opacity: 0.18;
      mix-blend-mode: screen;
      pointer-events: none;
      position: absolute;
    }
  </style>
</head>
<body class="min-h-screen relative antialiased px-4 py-8 md:px-8 max-w-7xl mx-auto flex flex-col justify-between">

  <!-- Background Animated Blobs -->
  <div class="bg-blob w-[450px] h-[450px] rounded-full bg-emerald-500 top-[-10%] left-[-10%] animate-float"></div>
  <div class="bg-blob w-[450px] h-[450px] rounded-full bg-sky-500 bottom-[10%] right-[-10%] animate-float-delayed"></div>
  <div class="bg-blob w-[300px] h-[300px] rounded-full bg-teal-500 top-[40%] left-[30%] opacity-10"></div>

  <!-- React Mount Root -->
  <div id="root" class="w-full flex-grow z-10"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { 
      ResponsiveContainer, BarChart, Bar, Cell, XAxis, YAxis, Tooltip: RechartsTooltip 
    } = window.Recharts;

    // Custom modern SVGs
    const LeafIcon = () => (
      <svg className="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 0 8.5C17 15 15 20 11 20z" />
        <path d="M19 2c-2.26 4.33-5.27 7.14-8 10" />
      </svg>
    );

    const WaterIcon = () => (
      <svg className="w-5 h-5 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22a7 7 0 0 0 7-7c0-4.3-7-11-7-11S5 10.7 5 15a7 7 0 0 0 7 7z" />
      </svg>
    );

    const GlobeIcon = () => (
      <svg className="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
        <path d="M2 12h20" />
      </svg>
    );

    const NitrogenIcon = () => (
      <svg className="w-5 h-5 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 2v20" />
        <path d="M20 12H4" />
        <circle cx="12" cy="12" r="4" fill="currentColor" fillOpacity="0.1" />
        <path d="m19 19-3-3" />
        <path d="m5 5 3 3" />
        <path d="m19 5-3 3" />
        <path d="m5 19 3-3" />
      </svg>
    );

    const ZapIcon = () => (
      <svg className="w-4 h-4 text-emerald-400 inline mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
    );

    const FlameIcon = () => (
      <svg className="w-4 h-4 text-sky-400 inline mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
      </svg>
    );

    const ShieldIcon = () => (
      <svg className="w-6 h-6 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
    );

    // Static environmental fact database for tree species
    const treeDescriptions = {
      '소나무': '우리나라 대표 침엽수로, 연간 약 8.6kg의 CO2를 안정적으로 흡수합니다. 승용차 36km 주행 시 배출되는 탄소를 상쇄할 수 있는 수준입니다.',
      '참나무': '기후변화 적응력이 뛰어난 활엽수종으로, 연간 약 9.3kg의 CO2를 대기에서 제거하며 다량의 산소를 공급합니다.',
      '느티나무': '넓은 잎으로 도심 열섬 현상을 차단하고, 연간 15.2kg의 높은 탄소 흡수 성능을 보여 가로수로 인기가 높습니다.',
      '상수리나무': '참나무과 수종 중 목재 탄소 저장 능력이 탁월하며, 연간 12.1kg의 탄소를 굳건하게 잠가둡니다.',
      '백합나무': '성장 속도가 엄청나게 빠른 고성능 속성수로, 연간 39.6kg이라는 대형 흡수 능력을 자랑하는 환경 구원 수종입니다.'
    };

    function App() {
      // 1. KEPCO Energy Inputs States
      const [electricity, setElectricity] = useState(342); // kWh
      const [gas, setGas] = useState(45); // m3
      const [isAutoSync, setIsAutoSync] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);

      // 2. Tree Species Bar Chart Hover State
      const [hoveredTree, setHoveredTree] = useState(null);

      // 3. API Certification Hub States
      const [certInput, setCertInput] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);
      const [verificationResult, setVerificationResult] = useState(null);

      // Trigger Auto-Sync Loading Animation
      useEffect(() => {
        if (isAutoSync) {
          setIsSyncing(true);
          const timer = setTimeout(() => {
            setElectricity(342);
            setGas(45);
            setIsSyncing(false);
          }, 1500);
          return () => clearTimeout(timer);
        }
      }, [isAutoSync]);

      // Calculate Carbon footprint values dynamically
      // CO2 factors: Electricity: 0.4781 kg/kWh, Gas: 2.1760 kg/m3
      const elecCarbon = useMemo(() => electricity * 0.4781, [electricity]);
      const gasCarbon = useMemo(() => gas * 2.1760, [gas]);
      const transportCarbon = 180.0; // Fixed Base values
      const wasteCarbon = 80.0;      // Fixed Base values
      const totalCarbon = useMemo(() => {
        return elecCarbon + gasCarbon + transportCarbon + wasteCarbon;
      }, [elecCarbon, gasCarbon]);

      // Handlers for manual input adjustments
      const handleElectricityChange = (e) => {
        if (!isAutoSync) {
          const val = parseFloat(e.target.value);
          setElectricity(isNaN(val) ? 0 : val);
        }
      };

      const handleGasChange = (e) => {
        if (!isAutoSync) {
          const val = parseFloat(e.target.value);
          setGas(isNaN(val) ? 0 : val);
        }
      };

      // Recharts Data for tree species
      const barData = [
        { name: '소나무', absorption: 8.6 },
        { name: '참나무', absorption: 9.3 },
        { name: '상수리나무', absorption: 12.1 },
        { name: '느티나무', absorption: 15.2 },
        { name: '백합나무', absorption: 39.6 }
      ];

      // Recharts Data for Emissions Source Donut (Dynamic)
      const pieData = useMemo(() => [
        { name: '전력 (KEPCO)', value: parseFloat(elecCarbon.toFixed(1)), color: '#10b981' },
        { name: '난방 (KEPCO)', value: parseFloat(gasCarbon.toFixed(1)), color: '#38bdf8' },
        { name: '교통 (고정)', value: transportCarbon, color: '#047857' },
        { name: '폐기물 (고정)', value: wasteCarbon, color: '#0284c7' }
      ], [elecCarbon, gasCarbon]);

      const totalPieValue = useMemo(() => {
        return pieData.reduce((acc, curr) => acc + curr.value, 0);
      }, [pieData]);

      // Verification Hub API Simulation
      const handleVerify = (e) => {
        e.preventDefault();
        if (!certInput.trim()) return;
        
        setIsVerifying(true);
        setVerificationResult(null);
        
        setTimeout(() => {
          setIsVerifying(false);
          setVerificationResult({
            serial: certInput,
            status: 'Verified',
            issuer: '한국환경산업기술원 (KEITI)',
            offset: '500 tCO2eq',
            date: '2026-07-01'
          });
        }, 1500);
      };

      return (
        <div className="space-y-6 py-4">
          {/* Header Area */}
          <header className="flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-800/60 pb-6 mb-2">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse-slow"></span>
                <span className="text-xs uppercase tracking-widest text-emerald-400 font-semibold">ESG Management Portal</span>
              </div>
              <h1 className="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-sky-400 tracking-tight">
                통합 환경 영향 대시보드
              </h1>
              <p className="text-xs md:text-sm text-slate-400 mt-1 font-light">
                실시간 환경 발자국 모니터링, KEPCO 에너지 사용 기반 배출 분석 및 탄소 인증 검증 플랫폼
              </p>
            </div>
            
            <div className="mt-4 md:mt-0 flex gap-4 text-xs">
              <div className="px-3.5 py-1.5 rounded-full glass-card border border-slate-800/80 flex items-center gap-2">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span className="text-slate-300 font-medium">조회 기준: 2026년 7월</span>
              </div>
              <div className="px-3.5 py-1.5 rounded-full glass-card border border-slate-800/80 flex items-center gap-2">
                <span className="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
                <span className="text-slate-300 font-medium">관리자: 국립환경원</span>
              </div>
            </div>
          </header>

          {/* Module 1: Multi-Footprint Metrics (KPI Cards) */}
          <section className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            {/* Card 1: Carbon Footprint (Dynamic) */}
            <div className="glass-panel rounded-2xl p-5 relative overflow-hidden transition-all duration-300 flex flex-col justify-between group">
              <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-emerald-500 to-emerald-400 opacity-70"></div>
              <div className="flex items-start justify-between">
                <div>
                  <p className="text-xs text-slate-400 font-medium tracking-wide uppercase">탄소 발자국</p>
                  <h3 className="text-xl md:text-2xl font-bold mt-1 text-slate-100 tracking-tight transition-all group-hover:text-emerald-400">
                    {totalCarbon.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 1})} <span className="text-xs font-semibold text-slate-400">kg CO2eq</span>
                  </h3>
                </div>
                <div className="p-2 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
                  <LeafIcon />
                </div>
              </div>
              <div className="mt-4 flex items-center justify-between text-xs border-t border-slate-800/60 pt-3">
                <span className="text-slate-500 font-light">전월 대비</span>
                <span className="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-bold flex items-center gap-0.5">
                  ↓ 4.2%
                </span>
              </div>
            </div>

            {/* Card 2: Water Footprint */}
            <div className="glass-panel rounded-2xl p-5 relative overflow-hidden transition-all duration-300 flex flex-col justify-between group">
              <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-sky-500 to-sky-400 opacity-70"></div>
              <div className="flex items-start justify-between">
                <div>
                  <p className="text-xs text-slate-400 font-medium tracking-wide uppercase">물 발자국</p>
                  <h3 className="text-xl md:text-2xl font-bold mt-1 text-slate-100 tracking-tight transition-all group-hover:text-sky-400">
                    34,200 <span className="text-xs font-semibold text-slate-400">Liters</span>
                  </h3>
                </div>
                <div className="p-2 rounded-xl bg-sky-500/10 border border-sky-500/20">
                  <WaterIcon />
                </div>
              </div>
              <div className="mt-4 flex items-center justify-between text-xs border-t border-slate-800/60 pt-3">
                <span className="text-slate-500 font-light">전월 대비</span>
                <span className="px-2 py-0.5 rounded-full bg-red-500/10 text-red-400 font-bold flex items-center gap-0.5">
                  ↑ 1.5%
                </span>
              </div>
            </div>

            {/* Card 3: Ecological Footprint */}
            <div className="glass-panel rounded-2xl p-5 relative overflow-hidden transition-all duration-300 flex flex-col justify-between group">
              <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-emerald-500 to-teal-500 opacity-70"></div>
              <div className="flex items-start justify-between">
                <div>
                  <p className="text-xs text-slate-400 font-medium tracking-wide uppercase">생태 발자국</p>
                  <h3 className="text-xl md:text-2xl font-bold mt-1 text-slate-100 tracking-tight transition-all group-hover:text-emerald-400">
                    1.42 <span className="text-xs font-semibold text-slate-400">gha</span>
                  </h3>
                </div>
                <div className="p-2 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
                  <GlobeIcon />
                </div>
              </div>
              <div className="mt-4 flex items-center justify-between text-xs border-t border-slate-800/60 pt-3">
                <span className="text-slate-500 font-light">전월 대비</span>
                <span className="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-bold flex items-center gap-0.5">
                  ↓ 2.8%
                </span>
              </div>
            </div>

            {/* Card 4: Nitrogen Footprint */}
            <div className="glass-panel rounded-2xl p-5 relative overflow-hidden transition-all duration-300 flex flex-col justify-between group">
              <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-sky-500 to-indigo-500 opacity-70"></div>
              <div className="flex items-start justify-between">
                <div>
                  <p className="text-xs text-slate-400 font-medium tracking-wide uppercase">질소 발자국</p>
                  <h3 className="text-xl md:text-2xl font-bold mt-1 text-slate-100 tracking-tight transition-all group-hover:text-sky-400">
                    18.3 <span className="text-xs font-semibold text-slate-400">kg N</span>
                  </h3>
                </div>
                <div className="p-2 rounded-xl bg-sky-500/10 border border-sky-500/20">
                  <NitrogenIcon />
                </div>
              </div>
              <div className="mt-4 flex items-center justify-between text-xs border-t border-slate-800/60 pt-3">
                <span className="text-slate-500 font-light">전월 대비</span>
                <span className="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-bold flex items-center gap-0.5">
                  ↓ 0.5%
                </span>
              </div>
            </div>
          </section>

          {/* Bento Grid: 2nd and 3rd Rows */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* Module 2: KEPCO Energy Calculator (Row 2, Col 1) */}
            <div className="glass-panel rounded-2xl p-6 flex flex-col justify-between h-[360px] relative overflow-hidden lg:col-span-1 border border-slate-800/60">
              <div>
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <span className="flex h-2 w-2 relative">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <h3 className="text-base font-bold text-slate-200">한전 에너지 탄소 계산기</h3>
                  </div>
                  
                  {/* Toggle Switch */}
                  <label className="relative inline-flex items-center cursor-pointer select-none">
                    <input 
                      type="checkbox" 
                      className="sr-only peer" 
                      checked={isAutoSync} 
                      onChange={() => setIsAutoSync(!isAutoSync)}
                    />
                    <div className="w-24 h-6 bg-slate-800 rounded-full peer peer-checked:after:translate-x-[48px] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-emerald-500 after:rounded-full after:h-5 after:w-11 after:transition-all border border-slate-700/80 flex items-center justify-between px-2 text-[9px] font-bold text-slate-400 uppercase">
                      <span className={`z-10 transition-colors ${!isAutoSync ? 'text-slate-900 font-extrabold' : 'text-slate-400'}`}>수동</span>
                      <span className={`z-10 transition-colors ${isAutoSync ? 'text-slate-900 font-extrabold' : 'text-slate-400'}`}>동기화</span>
                    </div>
                  </label>
                </div>

                {/* Form Inputs Container */}
                <div className="space-y-4 relative mt-6">
                  {/* Loading Syncing Overlay */}
                  {isSyncing && (
                    <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center rounded-xl border border-emerald-500/20">
                      <svg className="animate-spin h-8 w-8 text-emerald-400 mb-3" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                      </svg>
                      <span className="text-xs text-emerald-400 font-semibold tracking-wide animate-pulse">스마트 미터 연동 로딩 중...</span>
                    </div>
                  )}

                  {/* Electricity Input */}
                  <div>
                    <label className="text-xs text-slate-400 font-medium flex items-center justify-between mb-1">
                      <span>전기 사용량 (kWh)</span>
                      {isAutoSync && <span className="text-[10px] text-emerald-400 font-semibold flex items-center gap-0.5">● 동기화 활성</span>}
                    </label>
                    <div className="relative">
                      <span className="absolute left-3 top-2.5 text-xs text-slate-500 font-bold uppercase">Elec</span>
                      <input 
                        type="number" 
                        value={electricity} 
                        onChange={handleElectricityChange}
                        disabled={isAutoSync}
                        className="w-full pl-12 pr-4 py-2 rounded-xl glass-input text-sm text-right font-semibold"
                        min="0"
                      />
                    </div>
                  </div>

                  {/* Gas Input */}
                  <div>
                    <label className="text-xs text-slate-400 font-medium flex items-center justify-between mb-1">
                      <span>도시가스 사용량 (m³)</span>
                      {isAutoSync && <span className="text-[10px] text-emerald-400 font-semibold flex items-center gap-0.5">● 동기화 활성</span>}
                    </label>
                    <div className="relative">
                      <span className="absolute left-3 top-2.5 text-xs text-slate-500 font-bold uppercase">Gas</span>
                      <input 
                        type="number" 
                        value={gas} 
                        onChange={handleGasChange}
                        disabled={isAutoSync}
                        className="w-full pl-12 pr-4 py-2 rounded-xl glass-input text-sm text-right font-semibold"
                        min="0"
                      />
                    </div>
                  </div>
                </div>
              </div>

              {/* Emissions Results */}
              <div className="border-t border-slate-800/80 pt-4 mt-4">
                <div className="grid grid-cols-2 gap-4 text-xs">
                  <div>
                    <div className="text-slate-500 font-light flex items-center gap-1"><ZapIcon /> 전기 배출량</div>
                    <div className="text-sm font-semibold text-slate-200 mt-0.5">{elecCarbon.toFixed(1)} kg CO2eq</div>
                  </div>
                  <div>
                    <div className="text-slate-500 font-light flex items-center gap-1"><FlameIcon /> 가스 배출량</div>
                    <div className="text-sm font-semibold text-slate-200 mt-0.5">{gasCarbon.toFixed(1)} kg CO2eq</div>
                  </div>
                </div>
                <div className="mt-3.5 bg-emerald-950/20 border border-emerald-500/10 rounded-xl p-2.5 flex items-center justify-between">
                  <span className="text-xs font-semibold text-emerald-400/90">총 연동 배출량</span>
                  <span className="text-sm font-extrabold text-emerald-400">{(elecCarbon + gasCarbon).toFixed(1)} kg CO2eq</span>
                </div>
              </div>
            </div>

            {/* Module 3: Carbon Absorption by Tree Species BarChart (Row 2, Col 2-3) */}
            <div className="glass-panel rounded-2xl p-6 flex flex-col justify-between h-[360px] lg:col-span-2 border border-slate-800/60">
              <div className="flex items-center justify-between mb-2">
                <div>
                  <h3 className="text-base font-bold text-slate-200">주요 수종별 연간 탄소(CO2) 흡수량</h3>
                  <p className="text-[11px] text-slate-400 font-light mt-0.5">30년생 나무 한 그루가 1년 동안 흡수하는 이산화탄소량 (단위: kg CO2/년)</p>
                </div>
                <span className="text-[10px] px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold">산림청 인증 데이터</span>
              </div>

              {/* Chart & Detail Section Container */}
              <div className="grid grid-cols-1 md:grid-cols-5 gap-4 items-center flex-grow">
                {/* Recharts BarChart (Col span 3) */}
                <div className="h-44 md:h-52 md:col-span-3">
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart 
                      data={barData} 
                      margin={{ top: 15, right: 10, left: -25, bottom: 0 }}
                      onMouseMove={(state) => {
                        if (state && state.activePayload) {
                          setHoveredTree(state.activePayload[0].payload.name);
                        }
                      }}
                      onMouseLeave={() => setHoveredTree(null)}
                    >
                      {/* Define gradient for the bars */}
                      <defs>
                        <linearGradient id="barGreenGrad" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#34d399" stopOpacity={0.95}/>
                          <stop offset="100%" stopColor="#059669" stopOpacity={0.6}/>
                        </linearGradient>
                      </defs>
                      <XAxis 
                        dataKey="name" 
                        stroke="#64748b" 
                        fontSize={10} 
                        tickLine={false}
                        axisLine={false} 
                      />
                      <YAxis 
                        stroke="#64748b" 
                        fontSize={9} 
                        tickLine={false}
                        axisLine={false} 
                      />
                      <RechartsTooltip 
                        cursor={{ fill: 'rgba(16, 185, 129, 0.05)' }} 
                        content={({ active, payload }) => {
                          if (active && payload && payload.length) {
                            return (
                              <div className="bg-slate-900/90 border border-emerald-500/30 backdrop-blur-md rounded-xl p-2.5 shadow-xl text-xs">
                                <p className="font-bold text-slate-200">{payload[0].name}</p>
                                <p className="text-emerald-400 font-extrabold mt-0.5">{payload[0].value} kg CO₂ / 년</p>
                              </div>
                            );
                          }
                          return null;
                        }}
                      />
                      <Bar 
                        dataKey="absorption" 
                        fill="url(#barGreenGrad)" 
                        radius={[6, 6, 0, 0]}
                        animationDuration={800}
                      >
                        {barData.map((entry, index) => (
                          <Cell 
                            key={`cell-${index}`} 
                            className="transition-all duration-300 cursor-pointer"
                            stroke={hoveredTree === entry.name ? '#34d399' : 'transparent'}
                            strokeWidth={1.5}
                          />
                        ))}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                </div>

                {/* Tree Description Details Box (Col span 2) */}
                <div className="md:col-span-2 h-44 md:h-48 rounded-xl bg-slate-900/40 border border-slate-800/80 p-4 flex flex-col justify-center transition-all duration-300">
                  {hoveredTree ? (
                    <div>
                      <div className="flex items-center gap-2 mb-1.5">
                        <span className="text-xs font-bold text-emerald-400 px-2 py-0.5 rounded-full bg-emerald-500/10">{hoveredTree}</span>
                        <span className="text-xs text-slate-300 font-semibold">{barData.find(t => t.name === hoveredTree)?.absorption} kg/년</span>
                      </div>
                      <p className="text-[11px] leading-relaxed text-slate-300 font-light font-sans">
                        {treeDescriptions[hoveredTree]}
                      </p>
                    </div>
                  ) : (
                    <div className="text-center text-slate-400">
                      <div className="w-10 h-10 rounded-full bg-slate-800/60 flex items-center justify-center mx-auto mb-2 text-emerald-400">
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                      </div>
                      <p className="text-xs font-medium text-slate-300">수종 상세 정보</p>
                      <p className="text-[10px] text-slate-500 mt-1">왼쪽 그래프 막대에 마우스를 올리면 탄소 흡수 정보와 친환경 환산 가치를 확인하실 수 있습니다.</p>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Module 4: Emission Source Analysis DonutChart (Row 3, Col 1) */}
            <div className="glass-panel rounded-2xl p-6 flex flex-col justify-between h-[360px] lg:col-span-1 border border-slate-800/60">
              <div>
                <h3 className="text-base font-bold text-slate-200">배출원 분석 (비율)</h3>
                <p className="text-[11px] text-slate-400 font-light mt-0.5">전기/가스 실시간 배출량 및 교통/폐기물 기반 비율 분석</p>
              </div>

              {/* Pie/Donut Chart Component */}
              <div className="relative w-full h-44 flex items-center justify-center">
                <svg className="w-full h-full" viewBox="0 0 200 200">
                  {/* Draw simple responsive SVG Pie chart for high robustness and beautiful style */}
                  {(() => {
                    let accumulatedAngle = 0;
                    return pieData.map((slice, index) => {
                      const percentage = slice.value / totalPieValue;
                      const angle = percentage * 360;
                      
                      // Calculate coordinates
                      const r = 70;
                      const cx = 100;
                      const cy = 100;
                      
                      const startAngle = accumulatedAngle;
                      const endAngle = accumulatedAngle + angle;
                      accumulatedAngle += angle;

                      // Convert polar to cartesian
                      const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
                        const angleInRadians = ((angleInDegrees - 90) * Math.PI) / 180.0;
                        return {
                          x: centerX + radius * Math.cos(angleInRadians),
                          y: centerY + radius * Math.sin(angleInRadians)
                        };
                      };

                      const start = polarToCartesian(cx, cy, r, endAngle);
                      const end = polarToCartesian(cx, cy, r, startAngle);
                      const largeArcFlag = angle > 180 ? 1 : 0;

                      // Arc path
                      const pathData = [
                        `M ${start.x} ${start.y}`,
                        `A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y}`
                      ].join(" ");

                      return (
                        <path 
                          key={index}
                          d={pathData}
                          fill="none"
                          stroke={slice.color}
                          strokeWidth="18"
                          strokeLinecap="round"
                          className="transition-all duration-300 cursor-pointer hover:opacity-85"
                          style={{ transformOrigin: '100px 100px' }}
                        />
                      );
                    });
                  })()}
                </svg>
                {/* Center text content overlay */}
                <div className="absolute flex flex-col items-center justify-center text-center">
                  <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">총 탄소배출</span>
                  <span className="text-xl font-extrabold text-slate-100 mt-0.5">{totalCarbon.toFixed(1)}</span>
                  <span className="text-[9px] text-emerald-400 font-bold tracking-wider">kg CO2eq</span>
                </div>
              </div>

              {/* Customized Legends */}
              <div className="grid grid-cols-2 gap-2 text-xs border-t border-slate-800/60 pt-4">
                {pieData.map((slice, index) => {
                  const pct = ((slice.value / totalPieValue) * 100).toFixed(0);
                  return (
                    <div key={index} className="flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full" style={{ backgroundColor: slice.color }}></span>
                      <span className="text-slate-400 truncate text-[11px]">{slice.name}:</span>
                      <span className="text-slate-200 font-bold text-[11px] ml-auto">{pct}%</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Module 5: Official Carbon Certificate Verification KEITI Hub (Row 3, Col 2-3) */}
            <div className="glass-panel rounded-2xl p-6 flex flex-col justify-between h-[360px] lg:col-span-2 border border-slate-800/60 relative overflow-hidden">
              
              {/* Header section with live indicator */}
              <div className="flex items-start justify-between">
                <div>
                  <h3 className="text-base font-bold text-slate-200">공식 인증서 검증 (KEITI / KCCI)</h3>
                  <p className="text-[11px] text-slate-400 font-light mt-0.5">외부 플랫폼 연동을 통한 환경성적 및 탄소 크레딧 진위 검증</p>
                </div>
                {/* Blinking Live indicator */}
                <div className="flex items-center gap-2 px-2.5 py-1 rounded-full bg-emerald-950/40 border border-emerald-500/20 text-[9px] font-bold text-emerald-400 tracking-wider">
                  <span className="flex h-1.5 w-1.5 relative">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-400"></span>
                  </span>
                  API 상태: 연결됨 (Live)
                </div>
              </div>

              {/* Form and Verification Search Input */}
              <div className="flex-grow flex flex-col justify-center my-4">
                <form onSubmit={handleVerify} className="flex gap-2">
                  <div className="relative flex-grow">
                    <span className="absolute left-3.5 top-3 text-slate-500">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                      </svg>
                    </span>
                    <input 
                      type="text" 
                      placeholder="인증서 일련번호 입력 (예: K-ETS-2026)" 
                      value={certInput}
                      onChange={(e) => setCertInput(e.target.value)}
                      disabled={isVerifying}
                      className="w-full pl-10 pr-4 py-2.5 rounded-xl glass-input text-xs font-semibold"
                    />
                  </div>
                  <button 
                    type="submit" 
                    disabled={isVerifying || !certInput.trim()}
                    className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 font-extrabold text-xs text-slate-950 transition-all shadow-md active:scale-95 disabled:opacity-50 disabled:pointer-events-none"
                  >
                    검증하기
                  </button>
                </form>

                {/* Display Area for States: Initial / Loading / Result */}
                <div className="mt-4 flex-grow flex items-center justify-center min-h-[140px]">
                  {isVerifying ? (
                    <div className="flex flex-col items-center justify-center text-center">
                      <svg className="animate-spin h-8 w-8 text-emerald-400 mb-3" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                      </svg>
                      <p className="text-xs text-emerald-400 font-semibold tracking-wide animate-pulse">KEITI DB에서 불러오는 중...</p>
                    </div>
                  ) : verificationResult ? (
                    /* Verified Card Output with Green Glowing Ring */
                    <div className="w-full glass-card border border-emerald-500/30 rounded-xl p-4 flex flex-col md:flex-row items-center gap-4 shadow-lg shadow-emerald-950/20 relative animate-float">
                      <div className="absolute top-0 right-0 px-2.5 py-0.5 rounded-bl-lg bg-emerald-500/10 border-l border-b border-emerald-500/20 text-[9px] font-bold text-emerald-400 tracking-wider">
                        VERIFIED SECURE
                      </div>
                      <div className="p-3.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                        <ShieldIcon />
                      </div>
                      <div className="flex-grow grid grid-cols-2 md:grid-cols-4 gap-3 text-left w-full">
                        <div>
                          <div className="text-[10px] text-slate-500 font-semibold uppercase">검증 상태</div>
                          <div className="text-xs font-bold text-emerald-400 mt-0.5 flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> 유효함 (Verified)
                          </div>
                        </div>
                        <div>
                          <div className="text-[10px] text-slate-500 font-semibold uppercase">공식 발행처</div>
                          <div className="text-xs font-bold text-slate-200 mt-0.5">{verificationResult.issuer}</div>
                        </div>
                        <div>
                          <div className="text-[10px] text-slate-500 font-semibold uppercase">인증 상쇄량</div>
                          <div className="text-xs font-extrabold text-emerald-400 mt-0.5">{verificationResult.offset}</div>
                        </div>
                        <div>
                          <div className="text-[10px] text-slate-500 font-semibold uppercase">인증서 발행일</div>
                          <div className="text-xs font-bold text-slate-200 mt-0.5">{verificationResult.date}</div>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="text-center text-slate-500 flex flex-col items-center">
                      <svg className="w-10 h-10 text-slate-700 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                      </svg>
                      <p className="text-xs font-medium text-slate-400">탄소 배출권 인증서 유효성 실시간 조회</p>
                      <p className="text-[10px] text-slate-600 mt-1">인증서 일련번호를 검색창에 입력하시고 검증 버튼을 누르시면, KEITI DB와 대조하여 진위 여부를 판별합니다.</p>
                    </div>
                  )}
                </div>
              </div>
            </div>

          </div>

          {/* Footer Information */}
          <footer className="text-center text-[10px] text-slate-500 pt-6 border-t border-slate-800/40 mt-8 flex flex-col md:flex-row items-center justify-between gap-4 font-light">
            <p>© 2026 국립환경공단. All rights reserved. 본 정보는 시뮬레이션 데이터 및 KEITI, KEPCO 연동 계산식을 참조하여 산출되었습니다.</p>
            <div className="flex gap-4">
              <a href="#" className="hover:text-emerald-400 transition-colors">이용약관</a>
              <a href="#" className="hover:text-emerald-400 transition-colors">개인정보처리방침</a>
              <a href="#" className="hover:text-emerald-400 transition-colors">API 명세서</a>
            </div>
          </footer>
        </div>
      );
    }

    // Render the App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
