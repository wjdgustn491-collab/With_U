<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WITH_U 통합 탄소 플랫폼</title>
<link rel="stylesheet" href="assets/sidebar.css">
<style>
  :root{
    --navy:#0f2a44;
    --navy-soft:#1c4266;
    --green:#127a4b;
    --green-bright:#1fb865;
    --line:#e2e8ef;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#12202e;
    --muted:#6b7c8f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 오른쪽 4/5 영역: 화면 정중앙에 타이틀 ─────── */
  .stage{
    position:relative; overflow:hidden;
    min-height:100vh; display:grid; place-items:center;
    padding:56px 40px;
  }
  /* 배경 장식 — 좌상단 그린 글로우, 우하단 네이비 글로우 */
  .stage::before,
  .stage::after{content:""; position:absolute; border-radius:50%; pointer-events:none}
  .stage::before{
    width:520px; height:520px; top:-190px; left:-140px;
    background:radial-gradient(circle,rgba(31,184,101,.16) 0%,rgba(31,184,101,0) 70%);
  }
  .stage::after{
    width:640px; height:640px; bottom:-260px; right:-200px;
    background:radial-gradient(circle,rgba(28,66,102,.14) 0%,rgba(28,66,102,0) 70%);
  }

  .hero{position:relative; z-index:1; width:100%; max-width:760px; text-align:center}

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; margin:0 0 26px;
    padding:6px 14px 6px 11px; border-radius:99px;
    background:#fff; border:1px solid var(--line);
    font-size:11.5px; font-weight:700; letter-spacing:.1em; color:var(--navy-soft);
    box-shadow:0 1px 2px rgba(15,42,68,.04);
    animation:rise .5s cubic-bezier(.4,0,.2,1) both;
  }
  .eyebrow .dot{
    width:7px; height:7px; border-radius:50%; background:var(--green-bright);
    animation:pulse 1.7s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(31,184,101,.45)}
    50%    {opacity:.55; box-shadow:0 0 0 5px rgba(31,184,101,0)}
  }
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

  h1{
    margin:0; letter-spacing:-.045em; line-height:1.08; color:var(--navy);
    animation:rise .6s cubic-bezier(.4,0,.2,1) .06s both;
  }
  h1 .mark{
    display:block; font-size:clamp(38px,5.4vw,62px); font-weight:800;
    letter-spacing:-.02em;
  }
  h1 .mark i{
    font-style:normal;
    background:linear-gradient(100deg,var(--green) 10%,var(--green-bright) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1 .sub{
    display:block; margin-top:10px; font-size:clamp(21px,2.5vw,30px);
    font-weight:700; color:var(--navy-soft); letter-spacing:-.035em;
  }

  .lede{
    margin:24px auto 0; max-width:600px; font-size:14.5px; line-height:1.75; color:var(--muted);
    animation:rise .6s cubic-bezier(.4,0,.2,1) .12s both;
  }
  .rule{
    width:56px; height:3px; margin:30px auto 0; border-radius:99px;
    background:linear-gradient(90deg,var(--navy) 0%,var(--green-bright) 100%);
    animation:rise .6s cubic-bezier(.4,0,.2,1) .16s both;
  }

  /* 빠른 이동 — 사이드바와 같은 세 개의 서비스 */
  .quick{
    display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin:30px 0 0;
    animation:rise .6s cubic-bezier(.4,0,.2,1) .2s both;
  }
  .quick a{
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 15px; border-radius:99px; text-decoration:none;
    background:#fff; border:1px solid var(--line);
    font-size:12.5px; font-weight:600; color:var(--navy-soft);
    box-shadow:0 1px 2px rgba(15,42,68,.04);
    transition:transform .16s, border-color .16s, box-shadow .16s, color .16s;
  }
  .quick a:hover{
    transform:translateY(-2px); color:var(--green);
    border-color:#c9e5d6; box-shadow:0 10px 22px -12px rgba(15,42,68,.34);
  }
  .quick a span{
    width:6px; height:6px; border-radius:50%; background:var(--green-bright); flex-shrink:0;
  }
  .quick a:nth-child(2) span{background:var(--navy-soft)}
  .quick a:nth-child(3) span{background:#a8762b}
  .quick a:nth-child(4) span{background:#2b7fa8}

  .hint{
    margin:34px 0 0; font-size:11.5px; letter-spacing:.02em; color:#93a3b4;
    animation:rise .6s cubic-bezier(.4,0,.2,1) .26s both;
  }
  .hint b{color:var(--navy-soft); font-weight:600}

  @media (max-width:900px){
    .stage{padding:40px 22px 56px; min-height:calc(100vh - 68px)}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .eyebrow,h1,.lede,.rule,.quick,.hint{animation:none}
    .eyebrow .dot{animation:none}
  }
</style>
</head>
<body class="wu-has-sidebar">

<main class="stage">
  <div class="hero">

    <p class="eyebrow"><span class="dot"></span>2026 ESG PROJECT · PROTOTYPE</p>

    <h1>
      <span class="mark">WITH_U <i>통합 탄소 플랫폼</i></span>
      <span class="sub">배출과 상쇄를 상계 없이, 한 흐름으로</span>
    </h1>

    <div class="rule"></div>

    <p class="lede">
      실시간 계측으로 실제 배출량을 재고, 크레딧 소각으로 확보한 상쇄량을 별도로 집계하고,
      그 결과를 누구나 이해하는 일상 지표로 환산합니다.
    </p>

    <div class="quick">
      <a href="carbon-dashboard.html"><span></span>통합 탄소 대시보드</a>
      <a href="impact-dashboard.html"><span></span>ESG 공공 성과 지표</a>
      <a href="certificate-verify.html"><span></span>공식 인증서 검증</a>
      <a href="forest-map.html"><span></span>디바이스 주변 산림 면적</a>
    </div>

    <p class="hint">← 왼쪽 사이드바에서 언제든 <b>네 개의 서비스</b>를 이동할 수 있습니다</p>

  </div>
</main>

<script src="assets/sidebar.js" defer></script>
</body>
</html>
